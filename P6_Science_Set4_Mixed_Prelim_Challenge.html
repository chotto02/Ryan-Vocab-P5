<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P6 Science Set 4 — Mixed Prelim Challenge</title>
<script src="https://code.responsivevoice.org/responsivevoice.js?key=FREE"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#f0f2f5;--surface:#fff;--surface2:#f7f8fa;--border:#e2e5ea;--border-strong:#cbd0d8;
    --text:#1a1d23;--text-sec:#5a6072;--text-muted:#8a93a6;
    --accent:#2563eb;--accent-bg:#eff4ff;--accent-border:#bfccf8;
    --green:#16a34a;--green-bg:#f0fdf4;--green-border:#bbf7d0;
    --red:#dc2626;--red-bg:#fef2f2;--red-border:#fecaca;
    --amber:#d97706;--amber-bg:#fffbeb;--amber-border:#fde68a;
    --purple:#7c3aed;--purple-bg:#f5f3ff;
    --slate:#475569;--slate-bg:#f8fafc;--slate-border:#cbd5e1;
    --radius:10px;--shadow:0 1px 3px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.05)
  }
  body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}
  .page{max-width:760px;margin:0 auto;padding:2rem 1.25rem 4rem}
  .header{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:1.5rem;flex-wrap:wrap}
  .header-left h1{font-size:1.35rem;font-weight:600}
  .header-left p{font-size:.8125rem;color:var(--text-muted);margin-top:2px}
  .chapter-select{font-size:.8125rem;font-family:inherit;font-weight:500;padding:8px 12px;border-radius:var(--radius);border:1px solid var(--border-strong);background:var(--surface);color:var(--text);cursor:pointer;outline:none;box-shadow:var(--shadow)}
  .set-badge{display:inline-block;font-size:.7rem;font-weight:600;padding:3px 10px;border-radius:99px;background:#fef3c7;color:#92400e;border:1px solid #fde68a;margin-bottom:.5rem}
  .diff-badge{display:inline-block;font-size:.65rem;font-weight:600;padding:2px 8px;border-radius:99px;margin-left:6px;vertical-align:middle}
  .diff-hard{background:#fef2f2;color:var(--red);border:1px solid var(--red-border)}
  .diff-med{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border)}
  .audio-bar{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 16px;margin-bottom:1.25rem;box-shadow:var(--shadow)}
  .audio-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .audio-label{font-size:.8rem;font-weight:600;color:var(--text-sec);white-space:nowrap}
  .play-btn{display:flex;align-items:center;gap:8px;padding:9px 18px;border-radius:var(--radius);border:none;cursor:pointer;font-family:inherit;font-size:.875rem;font-weight:600;background:var(--accent);color:#fff;transition:background .15s}
  .play-btn:hover{background:#1d4ed8}.play-btn.playing{background:var(--red)}
  .auto-btn{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius);border:1px solid var(--border-strong);background:var(--surface2);color:var(--text-sec);font-family:inherit;font-size:.8125rem;font-weight:500;cursor:pointer;transition:all .15s}
  .auto-btn.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
  .voice-row{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);flex-wrap:wrap}
  .voice-lbl{font-size:.75rem;color:var(--text-muted);white-space:nowrap}
  .voice-sel,.speed-sel{font-size:.75rem;font-family:inherit;padding:5px 8px;border-radius:var(--radius);border:1px solid var(--border-strong);background:var(--surface);color:var(--text);cursor:pointer}
  .voice-sel{flex:1;min-width:140px}
  .speaking-badge{display:none;align-items:center;gap:6px;font-size:.75rem;color:var(--accent);font-weight:500;background:var(--accent-bg);padding:5px 10px;border-radius:99px;border:1px solid var(--accent-border)}
  .speaking-badge.show{display:flex}
  .bars{display:flex;gap:2px;align-items:center;height:14px}
  .bars span{width:3px;background:var(--accent);border-radius:2px;animation:eq .8s infinite ease-in-out;display:block}
  .bars span:nth-child(1){height:5px;animation-delay:0s}.bars span:nth-child(2){height:10px;animation-delay:.1s}
  .bars span:nth-child(3){height:14px;animation-delay:.2s}.bars span:nth-child(4){height:10px;animation-delay:.3s}
  .bars span:nth-child(5){height:5px;animation-delay:.4s}
  @keyframes eq{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1.25rem}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;text-align:center;box-shadow:var(--shadow)}
  .stat-card .val{font-size:1.5rem;font-weight:600}.stat-card .lbl{font-size:.7rem;color:var(--text-muted);margin-top:1px}
  .stat-card.s-correct .val{color:var(--green)}.stat-card.s-wrong .val{color:var(--red)}.stat-card.s-score .val{color:var(--accent)}
  .prog-wrap{margin-bottom:1.25rem}
  .prog-label{display:flex;justify-content:space-between;font-size:.75rem;color:var(--text-muted);margin-bottom:6px}
  .prog-track{height:6px;background:var(--border);border-radius:99px;overflow:hidden}
  .prog-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .4s ease}
  .legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:1.5rem}
  .leg-pill{font-size:.6875rem;font-weight:500;padding:4px 10px;border-radius:99px;cursor:pointer;border:1px solid transparent;transition:opacity .15s}
  .leg-pill:hover{opacity:.75}
  .ch0{background:var(--accent-bg);color:var(--accent);border-color:var(--accent-border)}
  .ch1{background:var(--green-bg);color:var(--green);border-color:var(--green-border)}
  .ch2{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-border)}
  .ch3{background:var(--purple-bg);color:var(--purple);border-color:#ddd6fe}
  .ch4{background:var(--red-bg);color:var(--red);border-color:var(--red-border)}
  .qcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.75rem;box-shadow:var(--shadow);margin-bottom:1rem}
  .qcard-meta{display:flex;align-items:center;gap:8px;margin-bottom:1rem;flex-wrap:wrap}
  .topic-pill{font-size:.7rem;font-weight:600;padding:3px 10px;border-radius:99px;letter-spacing:.02em}
  .qnum{font-size:.75rem;color:var(--text-muted);margin-left:auto}
  .question{font-size:1rem;font-weight:500;line-height:1.65;margin-bottom:1.25rem}
  .options{display:grid;gap:9px}
  .opt{width:100%;text-align:left;padding:12px 15px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:inherit;font-size:.875rem;cursor:pointer;display:flex;gap:12px;align-items:flex-start;transition:border-color .15s,background .15s;line-height:1.5}
  .opt:hover:not(:disabled){background:var(--accent-bg);border-color:var(--accent-border)}.opt:disabled{cursor:default}
  .opt-label{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-size:.6875rem;font-weight:600;flex-shrink:0;color:var(--text-sec);margin-top:1px;transition:all .15s}
  .opt-text{flex:1}
  .opt.correct{background:var(--green-bg);border-color:var(--green-border)}.opt.correct .opt-label{background:var(--green);border-color:var(--green);color:#fff}.opt.correct .opt-text{color:var(--green);font-weight:500}
  .opt.wrong{background:var(--red-bg);border-color:var(--red-border)}.opt.wrong .opt-label{background:var(--red);border-color:var(--red);color:#fff}.opt.wrong .opt-text{color:var(--red);font-weight:500}
  .opt.reveal{background:var(--green-bg);border-color:var(--green-border)}.opt.reveal .opt-label{background:var(--green);border-color:var(--green);color:#fff}.opt.reveal .opt-text{color:var(--green)}
  .feedback{margin-top:1rem;padding:13px 16px;border-radius:var(--radius);font-size:.8125rem;line-height:1.6;color:var(--text-sec);background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--accent);display:none}
  .feedback.show{display:block}.feedback strong{color:var(--text)}
  .actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:.5rem}
  .btn{font-family:inherit;font-size:.875rem;font-weight:500;padding:10px 20px;border-radius:var(--radius);cursor:pointer;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);transition:background .15s}
  .btn:hover{background:var(--surface2)}.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn-primary:hover{background:#1d4ed8}.btn-skip{color:var(--text-muted);border-color:var(--border)}
  .done-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:3rem 2rem;text-align:center;box-shadow:var(--shadow)}
  .done-ring{width:110px;height:110px;border-radius:50%;background:var(--accent-bg);border:3px solid var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 1.5rem}
  .done-pct{font-size:1.75rem;font-weight:600;color:var(--accent)}.done-pct-label{font-size:.6875rem;color:var(--text-muted)}
  .done-score{font-size:1.1rem;font-weight:600;margin-bottom:6px}.done-msg{font-size:.875rem;color:var(--text-sec);margin-bottom:2rem}
  .done-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:2rem}
  .done-stat{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:12px}
  .done-stat .v{font-size:1.25rem;font-weight:600}.done-stat .l{font-size:.7rem;color:var(--text-muted);margin-top:2px}
  .done-stat.g .v{color:var(--green)}.done-stat.r .v{color:var(--red)}.done-stat.b .v{color:var(--accent)}
  @media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}.page{padding:1.25rem 1rem 3rem}.qcard{padding:1.25rem}}
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <div class="header-left">
      <div class="set-badge">SET 4 of 4 · CHALLENGE</div>
      <h1>Mixed Prelim Challenge</h1>
      <p>Hard application questions drawn from 2026 school prelim papers</p>
    </div>
    <select class="chapter-select" id="chapterSel" onchange="changeChapter()">
      <option value="all">All topics (mixed)</option>
      <option value="0">Food webs &amp; ecology</option>
      <option value="1">Energy &amp; forces</option>
      <option value="2">Body systems &amp; health</option>
      <option value="3">Environment &amp; human impact</option>
      <option value="4">Experiment &amp; scientific method</option>
    </select>
  </div>
  <div class="audio-bar">
    <div class="audio-row">
      <span class="audio-label">🎙 Read aloud</span>
      <button class="play-btn" id="playBtn" onclick="onPlayBtn()"><span id="playIcon">▶</span><span id="playLabel">Read question</span></button>
      <button class="auto-btn" id="autoBtn" onclick="toggleAuto()"><span id="autoIcon">🔇</span><span id="autoLabel">Auto-read off</span></button>
      <div class="speaking-badge" id="speakBadge"><div class="bars"><span></span><span></span><span></span><span></span><span></span></div>Speaking…</div>
    </div>
    <div class="voice-row">
      <span class="voice-lbl">Voice</span><select class="voice-sel" id="voiceSel" onchange="onVoiceChange()"></select>
      <span class="voice-lbl">Speed</span>
      <select class="speed-sel" id="speedSel">
        <option value="0.7">Slow</option><option value="0.85">Easy</option>
        <option value="1" selected>Normal</option><option value="1.15">Fast</option>
      </select>
    </div>
  </div>
  <div class="legend">
    <span class="leg-pill ch0" onclick="setChapter(0)">🕸 Food webs</span>
    <span class="leg-pill ch1" onclick="setChapter(1)">⚡ Energy &amp; forces</span>
    <span class="leg-pill ch2" onclick="setChapter(2)">🫀 Body systems</span>
    <span class="leg-pill ch3" onclick="setChapter(3)">🌍 Environment</span>
    <span class="leg-pill ch4" onclick="setChapter(4)">🔬 Scientific method</span>
  </div>
  <div class="stats">
    <div class="stat-card"><div class="val" id="sTotal">0</div><div class="lbl">total</div></div>
    <div class="stat-card s-correct"><div class="val" id="sCorrect">0</div><div class="lbl">correct</div></div>
    <div class="stat-card s-wrong"><div class="val" id="sWrong">0</div><div class="lbl">wrong</div></div>
    <div class="stat-card s-score"><div class="val" id="sScore">—</div><div class="lbl">score</div></div>
  </div>
  <div class="prog-wrap">
    <div class="prog-label"><span id="progText">Question 0 of 0</span><span id="progPct">0%</span></div>
    <div class="prog-track"><div class="prog-fill" id="pbar" style="width:0%"></div></div>
  </div>
  <div id="quizArea"></div>
  <div class="actions" id="actions"></div>
</div>
<script>
const LABELS=['A','B','C','D'];
const CH_CLASS=['ch0','ch1','ch2','ch3','ch4'];
const VOICE_OPTIONS=[{label:"UK English Female (natural)",rv:"UK English Female"},{label:"UK English Male",rv:"UK English Male"},{label:"US English Female",rv:"US English Female"},{label:"US English Male",rv:"US English Male"},{label:"Australian Female",rv:"Australian Female"},{label:"Australian Male",rv:"Australian Male"}];
let currentVoice=VOICE_OPTIONS[0].rv,autoRead=false,isSpeaking=false;
function initVoiceSelect(){const s=document.getElementById('voiceSel');VOICE_OPTIONS.forEach((v,i)=>{const o=document.createElement('option');o.value=i;o.textContent=v.label;s.appendChild(o)})}
function onVoiceChange(){currentVoice=VOICE_OPTIONS[+document.getElementById('voiceSel').value].rv}
function getRate(){return parseFloat(document.getElementById('speedSel').value)||1}
function clean(t){return t.replace(/CO₂/g,'carbon dioxide').replace(/O₂/g,'oxygen').replace(/→/g,'produces').replace(/\+/g,'plus').replace(/°C/g,'degrees Celsius').replace(/<br\s*\/?>/gi,', ').replace(/<[^>]+>/g,'').replace(/&amp;/g,'and').replace(/\s+/g,' ').trim()}
function buildScript(q){return clean(q.q)+'. '+q.opts.map((o,i)=>'Option '+LABELS[i]+'. '+clean(o)).join('. ')+'.'}
function speak(text,onDone){if(typeof responsiveVoice==='undefined'){const s=window.speechSynthesis;if(!s){if(onDone)onDone();return}s.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=getRate();u.onend=u.onerror=()=>{setSpeaking(false);if(onDone)onDone()};s.speak(u);setSpeaking(true);return}responsiveVoice.cancel();setSpeaking(true);responsiveVoice.speak(text,currentVoice,{rate:getRate(),pitch:1,volume:1,onend:()=>{setSpeaking(false);if(onDone)onDone()},onerror:()=>{setSpeaking(false);if(onDone)onDone()}})}
function stopSpeech(){if(typeof responsiveVoice!=='undefined')responsiveVoice.cancel();if(window.speechSynthesis)window.speechSynthesis.cancel();setSpeaking(false)}
function setSpeaking(val){isSpeaking=val;document.getElementById('speakBadge').classList.toggle('show',val);const b=document.getElementById('playBtn');b.classList.toggle('playing',val);document.getElementById('playIcon').textContent=val?'■':'▶';document.getElementById('playLabel').textContent=val?'Stop':'Read question'}
function onPlayBtn(){if(isSpeaking){stopSpeech();return}if(!deck.length||idx>=deck.length)return;speak(buildScript(deck[idx]))}
function toggleAuto(){autoRead=!autoRead;const b=document.getElementById('autoBtn');b.classList.toggle('on',autoRead);document.getElementById('autoIcon').textContent=autoRead?'🔊':'🔇';document.getElementById('autoLabel').textContent=autoRead?'Auto-read on':'Auto-read off';if(autoRead&&!isSpeaking&&deck.length&&idx<deck.length)setTimeout(()=>speak(buildScript(deck[idx])),200);else if(!autoRead)stopSpeech()}

const ALL_Q=[
  // Ch 0 — Food webs & ecology
  {ch:0,t:"Food webs & ecology",q:"In a food web: P → Q ← R → S, and V → U ← Q, and T feeds on S. Organism W is introduced and feeds on S only. What is the immediate effect on R and T?",opts:["R increases, T decreases","R decreases, T increases","R increases, T increases","R decreases, T decreases"],ans:0,exp:"W feeds on S, so S decreases. R is eaten by S (S is R's predator), so fewer S means less predation on R — R increases. T feeds on S, so fewer S means less food for T — T decreases. Answer: R increases, T decreases."},
  {ch:0,t:"Food webs & ecology",q:"A food chain: plant → organism E → organism F. Organism F was introduced when plant population was rising. Organism G was later introduced and competes with F for organism E only. What is the most likely effect on organism F?",opts:["F increases because G brings more food","F decreases because G competes with F for organism E, so F has less food","F is unaffected as G eats different food","F and G will both increase indefinitely"],ans:1,exp:"G competes with F for the same food source (organism E). With more competition, less of organism E is available for F. With less food, F's population decreases. This is the principle: competition for the same resource reduces the population of competing organisms."},
  {ch:0,t:"Food webs & ecology",q:"In a field food web, organisms A and G are producers. B, C, D are consumers. E feeds on D and C and also feeds on chickens in a nearby village. Villagers trap E to protect their chickens. What is the effect on D?",opts:["D decreases because fewer E means less predation so D's prey decreases","D increases because fewer E (predators) means fewer organisms eating D","D is unaffected as D does not interact with E","D increases then decreases in a cycle"],ans:1,exp:"E is a predator of D. When villagers reduce the population of E, there are fewer predators eating D. With less predation, D's population increases. This is the classic predator-prey relationship — fewer predators leads to more prey."},
  {ch:0,t:"Food webs & ecology",q:"Ken placed equal numbers of fish K, L and M in two tanks. Tank X has K and L; Tank Y has K and M. After a week, in Tank X: K increases and L decreases. In Tank Y: M increases and K decreases. Which food chain is correct?",opts:["Plant → K → L → M","Plant → L → K → M","Plant → M → K → L","Plant → L → M → K"],ans:1,exp:"In Tank X: K increases and L decreases — K is eating L. So L is prey, K is predator: Plant → L → K. In Tank Y: M increases and K decreases — M is eating K. So K is prey, M is predator: K → M. Combining: Plant → L → K → M."},
  {ch:0,t:"Food webs & ecology",q:"Plant E grows at the bottom of a pond. Other plants A, B, C, D grow above it. When populations of A, B, C, D increased, population of E decreased. Which plants most likely caused the decrease?",opts:["Plant A only","Plants A and D","Plants B and C","Plants B, C and D"],ans:2,exp:"Plant E is a submerged aquatic plant at the bottom of the pond. It depends on light passing through the water for photosynthesis. Plants B and C are floating or surface plants that block sunlight from reaching plant E below. A and D are land-based plants on the shore and would not block light in the water."},
  {ch:0,t:"Food webs & ecology",q:"The graph shows plant population rising, then dropping suddenly, then rising again. Organism F (feeds on organism E which eats plants) was introduced when the plant population started recovering. A student claims F was introduced at the point where plants started to rise again. Is this correct and why?",opts:["No, F should be introduced when plants are at their peak","Yes, F was introduced at the low point where plants begin recovering, because F feeds on E which had been eating plants — fewer E means plants can recover","No, F is introduced when plants are falling","Yes, F is introduced at the highest plant population point"],ans:1,exp:"The plant population fell because organism E was eating them. Plants begin to recover when E's population is declining. Organism F (which feeds on E) would have been introduced around the time plants start to recover — because F reducing E's population allows plant numbers to rise again. The 'X' is marked at the bottom of the dip where recovery begins."},

  // Ch 1 — Energy & forces
  {ch:1,t:"Energy & forces",q:"A rubber ball dropped from 1 metre bounced to successively lower heights each time. Which statement correctly explains in terms of energy why the ball did not bounce back to its original height?",opts:["The ball lost mass each time it bounced","Some kinetic energy was converted to heat and sound energy when the ball hit the floor, so less gravitational potential energy was stored each bounce — meaning it cannot return to the original height","The ball gained weight after each bounce","Gravity increased each time the ball fell"],ans:1,exp:"When the ball hits the floor, some kinetic energy is converted to heat and sound (due to impact and deformation). The remaining kinetic energy converts back to gravitational potential energy. Since some energy is always lost to heat and sound, less GPE is stored — so the ball rises to a lower height each time."},
  {ch:1,t:"Energy & forces",q:"Vanessa's battery toy car moves on a flat surface. She adds a figurine to the car and repeats with identical new batteries. The car moves slower with the figurine. Why?",opts:["The batteries have less electrical energy with the figurine","Adding the figurine increases the total mass. More electrical energy is converted to heat due to greater friction, so less electrical energy is converted to kinetic energy — the car moves slower","The figurine blocks air flow making the car slower","The wheels turn less with more weight on them"],ans:1,exp:"Adding the figurine increases total mass. Greater mass increases frictional force between wheels and surface. More friction means more energy is converted to heat — leaving less electrical energy available to be converted to kinetic energy. So the car moves slower with the figurine."},
  {ch:1,t:"Energy & forces",q:"The toy car from a flat surface then moves up a ramp from Y (bottom) to Z (top). Would the toy car move faster or slower going up the ramp than on the flat surface?",opts:["Faster — the motor pushes harder going uphill","Slower — it is moving against gravity going uphill, which requires extra energy and reduces speed","The same speed — the motor provides constant energy","Faster — the ramp gives it extra momentum"],ans:1,exp:"On a flat surface, the motor's energy overcomes friction only. On a ramp, the motor must overcome both friction AND gravity (the car is moving against gravitational force going uphill). The same amount of electrical energy from the battery must do more work, so the car moves slower up the ramp."},
  {ch:1,t:"Energy & forces",q:"A spring-operated clamp holds object C in place. The spring's elastic force acts to keep C in place. When the handles are pushed together to open the clamp, what happens to the spring?",opts:["The spring is stretched and stores elastic potential energy","The push force compresses the spring from its natural position, moving it from its stationary state","The spring is destroyed when pushed","The spring loses all its stored energy when pushed"],ans:1,exp:"When the handles are pushed together, the force acts against the spring, compressing it from its natural (stationary) position. The spring is deformed from its rest state by the applied push force. When the handles are released, the elastic spring force returns the spring to its original shape, closing the clamp."},
  {ch:1,t:"Energy & forces",q:"Jayden turns on a tap above a water wheel. More water flowing increases the number of spins. Which correctly shows the main energy conversion and the effect of more water?",opts:["Heat energy → kinetic energy → potential energy; more water increases spins","Potential energy (water) → kinetic energy (falling water) → kinetic energy (spinning wheel); more water increases spins","Potential energy → kinetic energy → kinetic energy; more water decreases spins","Potential energy → heat energy → kinetic energy; more water increases spins"],ans:1,exp:"Water held in the tap has gravitational potential energy. As it falls, this converts to kinetic energy of the moving water. The moving water hits the wheel, transferring kinetic energy to make the wheel spin (kinetic energy). More water flowing means more energy transferred to the wheel, so the wheel spins faster — more spins per minute."},
  {ch:1,t:"Energy & forces",q:"Amy tested boxes of materials F, G, H sliding down a ramp. Material H took the longest (average ~10 seconds), G took the shortest (average ~2.8 seconds). Amy applied lubricant to the ramp surface. What is the effect on the results?",opts:["All boxes would take longer to slide down","All boxes would take the same time to slide down","All boxes would slide faster — time taken decreases — because lubricant reduces friction between boxes and ramp","Only material H would be affected"],ans:2,exp:"A lubricant reduces friction between the box and the ramp surface. Less friction means less force opposing the downward motion, so all boxes slide faster. The time taken for each box to slide down the ramp would decrease for all materials F, G, and H."},

  // Ch 2 — Body systems & health
  {ch:2,t:"Body systems & health",q:"Joseph coated different parts of leaves with oil: Leaf A = top surface only, Leaf B = underside only, Leaf C = no coating (control). Bubbles per minute: A=15, B=6, C=20. What can be concluded about the difference between leaves A and B?",opts:["Leaf A produces more bubbles because more sunlight reaches the top surface","Leaf B produced fewer bubbles than leaf A. The underside has more stomata than the top surface. Coating the underside blocks more stomata, reducing carbon dioxide intake and photosynthesis more than coating the top","Both surfaces have equal stomata and the oil had no effect","Leaf C proves that oil itself produces bubbles"],ans:1,exp:"Stomata are the tiny pores through which carbon dioxide enters for photosynthesis. Leaf B (underside coated) produced only 6 bubbles/minute — far fewer than Leaf A (top coated, 15/min). This shows the underside has more stomata. Blocking more stomata = less CO₂ intake = less photosynthesis = fewer oxygen bubbles produced."},
  {ch:2,t:"Body systems & health",q:"Jia Hao tested how packaging affects bacteria growth on meat at 25°C. Set-up A: container with no lid. Set-up B: sealed tightly with lid. Set-up C: wrapped tightly in plastic cling wrap. Meat in Set-up C had the least bacteria. Which best explains the observation for Set-up C?",opts:["All bacteria were killed when air was removed","The packaging lowered the temperature of the meat","The meat had less water, so bacteria could not survive inside","The meat had the least amount of oxygen for bacteria to grow in the tightly wrapped cling wrap"],ans:3,exp:"Wrapping tightly in cling wrap greatly reduces the amount of oxygen around the meat. Most harmful bacteria that spoil meat need oxygen to grow and reproduce. With the least oxygen available in Set-up C, bacteria grow the slowest, so the least bacteria were found. This is why vacuum-packed food stays fresh longer."},
  {ch:2,t:"Body systems & health",q:"Henry's heart rate was measured at the park. From minute 0 to 10: heart rate rose from 60 to 140 beats per minute. From minute 10 to 20: heart rate stayed at 140. From minute 20 to 30: heart rate dropped to 80. Which statement best explains the heart rate between minute 10 and 20?",opts:["He ran at his fastest speed possible","He was exercising at the same intensity — maintaining a constant level of physical activity","He stopped exercising but his heart was still recovering","His breathing rate had decreased so his heart rate remained constant"],ans:1,exp:"A constant heart rate at 140 bpm means the body's demand for oxygen and energy is steady. This happens when exercise intensity is constant — the person is maintaining the same level of physical activity. The heart does not need to speed up or slow down because energy demands are not changing."},
  {ch:2,t:"Body systems & health",q:"Joseph's experiment coated leaves with oil. He placed each leaf in water under a lamp and counted bubbles per minute for 5 minutes. What is the purpose of leaf C (no coating) in this experiment?",opts:["To show what happens with maximum oil coating","Leaf C is the control — for comparison, to show that any difference in bubble production between A and B is caused by the oil coating, not by other factors","To provide extra oxygen for the experiment","To test whether the lamp affects bubble production"],ans:1,exp:"Leaf C has no oil coating — it is the control variable. A control provides a standard for comparison. By having leaf C under the same conditions but without oil, Joseph can confirm that differences in bubble production between leaves A and B are due to the oil blocking stomata — not other factors like water temperature, light intensity, or the leaf itself."},

  // Ch 3 — Environment & human impact
  {ch:3,t:"Environment & human impact",q:"A student claims: 'Reforestation leads to soil erosion and causes global warming.' Which part of this claim is correct?",opts:["Both parts are correct","The claim about soil erosion is correct but global warming is incorrect","Both parts are incorrect — reforestation prevents soil erosion and reduces global warming","Reforestation causes global warming only"],ans:2,exp:"Reforestation means planting trees. Tree roots hold soil together, PREVENTING soil erosion (not causing it). More trees absorb more carbon dioxide during photosynthesis, which REDUCES the greenhouse effect and helps slow global warming (not cause it). Both parts of the student's claim are wrong — reforestation is environmentally beneficial."},
  {ch:3,t:"Environment & human impact",q:"Global warming raises temperatures. This affects some sea turtles whose sex is determined by temperature — higher temperatures produce more females. How does this reduce the survival of sea turtles?",opts:["More females mean more eggs so the population increases","Higher temperature causes more females to hatch, so the ratio of males to females becomes unbalanced, leading to fewer successful matings and reduced reproduction — population decreases","Higher temperature kills female turtles directly","The excess females eat all the food in the ocean"],ans:1,exp:"Sea turtle sex determination is temperature-dependent. Global warming increases temperatures, producing more and more female hatchlings. With far fewer males, many females cannot find mates to reproduce. This imbalance reduces successful reproduction and therefore the overall population decreases over time."},
  {ch:3,t:"Environment & human impact",q:"Which statement is correct about deforestation and reforestation? A: Reforestation leads to soil erosion. B: Reforestation causes global warming. C: Deforestation destroys habitats of animals. D: Deforestation by burning causes air pollution.",opts:["A and B only","B and C only","C and D only","A and D only"],ans:2,exp:"A is wrong: reforestation PREVENTS soil erosion. B is wrong: reforestation REDUCES global warming. C is correct: deforestation removes trees that are habitats for animals. D is correct: burning trees during deforestation releases smoke and particulates, causing air pollution. Only C and D are correct."},
  {ch:3,t:"Environment & human impact",q:"How does haze affect the survival of aquatic plants?",opts:["Haze provides more nutrients for plants in water","Haze blocks sunlight from reaching aquatic plants, reducing photosynthesis and plant growth, and also reduces oxygen in the water, affecting other organisms","Haze increases water temperature helping plants grow faster","Haze has no effect on aquatic plants"],ans:1,exp:"Haze is a thick layer of smoke and particles in the air. It blocks sunlight from penetrating into water. Aquatic plants need sunlight for photosynthesis. Less light means less photosynthesis, less food production, and less oxygen released. This reduces plant growth and lowers dissolved oxygen for fish and other aquatic organisms."},
  {ch:3,t:"Environment & human impact",q:"Danny wants to find out how the exposed surface area of water affects the rate of evaporation. He has two containers A and B of different sizes, 300ml of water, a measuring cylinder, and a stopwatch. Describe one way he can complete his experiment in a shorter time.",opts:["Use larger containers so more water evaporates","Increase the temperature of the surroundings to speed up evaporation, or reduce the time of the experiment from two hours to one hour","Use less water in each container","Stir the water continuously"],ans:1,exp:"Evaporation rate increases with higher temperature (more particles have enough energy to escape as vapour). Running the experiment at a higher temperature would make evaporation happen faster so results are obtained in less time. Alternatively, shortening the measurement time from two hours to one hour and comparing amounts evaporated would also work."},

  // Ch 4 — Scientific method
  {ch:4,t:"Scientific method",q:"Jun Hong carried out an experiment to find how the amount of light affects photosynthesis rate using an aquatic plant and a lamp. The distance between the lamp and plant was changed. What is the correct set of changed variable, measured result, and unchanged variable?",opts:["Changed: type of lamp, Measured: distance between lamp and plant, Unchanged: number of bubbles","Changed: distance between lamp and plant, Measured: size of bubbles, Unchanged: type of retort stand","Changed: number of bubbles per minute, Measured: distance of lamp from plant, Unchanged: type of plant","Changed: distance between lamp and plant, Measured: number of bubbles produced per minute, Unchanged: type of plant"],ans:3,exp:"The experiment investigates how light amount (changed by varying lamp distance) affects photosynthesis rate (measured by counting oxygen bubbles per minute). The changed variable is the distance between lamp and plant. The measured variable is number of bubbles per minute. The type of plant is kept the same (unchanged variable) to ensure a fair test."},
  {ch:4,t:"Scientific method",q:"Amy tested three flexible materials on a ramp using boxes of the same mass. She repeated each test three times. Why did Amy repeat the experiment three times for each box?",opts:["To make the boxes slide faster","To identify any unusual results (anomalous results) and calculate an average, making the results more reliable and accurate","To use up all the boxes","To test three different ramp angles"],ans:1,exp:"Repeating experiments serves two key purposes: (1) identifying anomalous (unusual) results that may be due to errors, which can then be excluded; (2) calculating an average result from multiple trials, which is more reliable than a single measurement. Repetition improves the reliability and accuracy of experimental results."},
  {ch:4,t:"Scientific method",q:"Seth conducted an experiment with three plants in jars X, Y, Z. X had a chemical releasing CO₂, Y had a chemical absorbing CO₂, and Z had neither. What is the changed variable in Seth's experiment?",opts:["The amount of sunlight each plant received","The amount of carbon dioxide available to each plant","The type of plant used","The size of the glass jar"],ans:1,exp:"The changed variable is the factor that is deliberately varied between the set-ups. In Seth's experiment, the amount of carbon dioxide in each jar is different: Jar X has extra CO₂ released, Jar Y has CO₂ absorbed (less available), and Jar Z has a normal amount. The changed variable is therefore the amount (concentration) of carbon dioxide."},
  {ch:4,t:"Scientific method",q:"Amy released each box from the same starting point on the ramp. How does having the same starting point ensure a fair test?",opts:["It makes all boxes the same mass","The same starting point ensures every box travels the same distance down the ramp, so any differences in time taken are due to the material of the box and not different distances traveled","It prevents the boxes from falling off the ramp","It ensures the boxes are all the same size"],ans:1,exp:"In a fair test, only the changed variable (material of box) should differ between trials. All other variables must be kept the same. Using the same starting point ensures every box travels exactly the same distance down the ramp. If distances were different, time differences could be due to different distances rather than the material — so same starting point = same distance = fair test."},
  {ch:4,t:"Scientific method",q:"Keng Kwang placed seeds X (in bright room) and Y (in dark cupboard) in identical containers with 100ml of water daily at the same temperature. After five days, both X and Y germinated and grew to about the same height. What can Keng Kwang conclude?",opts:["Plants grow faster in the dark","Seeds need warmth for germination","Seeds do not need light for germination — both seeds germinated in the presence and absence of light","Seeds need light to produce food after germination only"],ans:2,exp:"Both seed X (bright light) and seed Y (dark cupboard) germinated and grew to similar heights. Temperature and water were kept the same. The only difference was light. Since Y germinated without light just as well as X with light, the conclusion is that seeds do not need light for germination. (Note: they use stored food in the seed to germinate, not photosynthesis.)"},
];

let deck=[],idx=0,answered=false,correct=0,wrong=0,selected=-1;
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function setChapter(ch){document.getElementById('chapterSel').value=ch;changeChapter()}
function changeChapter(){stopSpeech();const v=document.getElementById('chapterSel').value;const f=v==='all'?[...ALL_Q]:ALL_Q.filter(q=>q.ch===+v);deck=shuffle(f);idx=0;correct=0;wrong=0;answered=false;selected=-1;render()}
function render(){updateStats();if(idx>=deck.length){renderDone();return}const q=deck[idx];const pct=deck.length>0?Math.round((idx/deck.length)*100):0;document.getElementById('pbar').style.width=pct+'%';document.getElementById('progText').textContent='Question '+(idx+1)+' of '+deck.length;document.getElementById('progPct').textContent=pct+'%';document.getElementById('quizArea').innerHTML=`<div class="qcard"><div class="qcard-meta"><span class="topic-pill ${CH_CLASS[q.ch]}">${q.t}</span><span class="qnum">${idx+1} / ${deck.length}</span></div><div class="question">${q.q.replace(/\n/g,'<br>')}</div><div class="options" id="opts">${q.opts.map((o,i)=>`<button class="opt" id="opt${i}" onclick="pick(${i})"><span class="opt-label">${LABELS[i]}</span><span class="opt-text">${o}</span></button>`).join('')}</div><div class="feedback" id="fb"><strong>Explanation: </strong>${q.exp}</div></div>`;if(answered){showResult(q);document.getElementById('fb').classList.add('show')}renderActions();if(autoRead&&!answered)setTimeout(()=>speak(buildScript(q)),400)}
function pick(i){if(answered)return;stopSpeech();answered=true;selected=i;const q=deck[idx];if(i===q.ans)correct++;else wrong++;showResult(q);document.getElementById('fb').classList.add('show');updateStats();renderActions();if(autoRead){const v=(i===q.ans)?'Correct! '+clean(q.exp):'The correct answer is option '+LABELS[q.ans]+'. '+clean(q.exp);setTimeout(()=>speak(v),400)}}
function showResult(q){document.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(i===q.ans)b.classList.add(selected===i?'correct':'reveal');else if(i===selected&&selected!==q.ans)b.classList.add('wrong')})}
function renderActions(){const a=document.getElementById('actions');if(!answered){a.innerHTML=`<button class="btn btn-skip" onclick="skip()">Skip question</button>`}else{const l=idx>=deck.length-1;a.innerHTML=`<button class="btn btn-primary" onclick="next()">${l?'See results':'Next question →'}</button><button class="btn btn-skip" onclick="restart()">Restart</button>`}}
function skip(){stopSpeech();idx++;answered=false;selected=-1;render()}
function next(){stopSpeech();idx++;answered=false;selected=-1;render()}
function restart(){stopSpeech();changeChapter()}
function updateStats(){const t=correct+wrong;document.getElementById('sTotal').textContent=deck.length;document.getElementById('sCorrect').textContent=correct;document.getElementById('sWrong').textContent=wrong;document.getElementById('sScore').textContent=t>0?Math.round((correct/t)*100)+'%':'—'}
function renderDone(){stopSpeech();const t=correct+wrong;const pct=t>0?Math.round((correct/t)*100):0;const msg=pct>=80?'🏆 Outstanding! You are PSLE ready!':pct>=60?'👍 Good effort on these hard questions — keep going!':'💪 These are tough prelim questions — review the explanations carefully and try again.';document.getElementById('pbar').style.width='100%';document.getElementById('progText').textContent='Completed!';document.getElementById('progPct').textContent='100%';document.getElementById('quizArea').innerHTML=`<div class="done-card"><div class="done-ring"><div class="done-pct">${pct}%</div><div class="done-pct-label">score</div></div><div class="done-score">${correct} out of ${deck.length} correct</div><div class="done-msg">${msg}</div><div class="done-grid"><div class="done-stat g"><div class="v">${correct}</div><div class="l">correct</div></div><div class="done-stat r"><div class="v">${wrong}</div><div class="l">wrong</div></div><div class="done-stat b"><div class="v">${deck.length-correct-wrong}</div><div class="l">skipped</div></div></div><button class="btn btn-primary" onclick="restart()">Try again</button>&nbsp;<button class="btn" onclick="setChapter('all')">All topics</button></div>`;document.getElementById('actions').innerHTML='';if(autoRead)speak('Challenge complete! You scored '+pct+' percent. '+correct+' correct out of '+deck.length+' questions.')}
initVoiceSelect();changeChapter();
</script>
