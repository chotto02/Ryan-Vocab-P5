<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P6 Science Flashcard MCQ — 2026 PSLE Prelims</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
  :root {
    --surface-0: #f1efe8;
    --surface-1: #f7f6f3;
    --surface-2: #ffffff;
    --text-primary: #1a1a18;
    --text-secondary: #5f5e5a;
    --text-muted: #888780;
    --border: rgba(0,0,0,0.1);
    --border-strong: rgba(0,0,0,0.18);
    --bg-accent: #e6f1fb;
    --text-accent: #185fa5;
    --border-accent: #85b7eb;
    --fill-accent: #378add;
    --on-accent: #ffffff;
    --bg-success: #eaf3de;
    --text-success: #3b6d11;
    --border-success: #97c459;
    --bg-danger: #fcebeb;
    --text-danger: #a32d2d;
    --border-danger: #f09595;
    --bg-warning: #faeeda;
    --text-warning: #854f0b;
    --bg-pro: #eeedfe;
    --text-pro: #534ab7;
    --border-pro: #afa9ec;
    --radius: 8px;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface-0: #1c1c1a;
      --surface-1: #222220;
      --surface-2: #2a2a28;
      --text-primary: #f0ede8;
      --text-secondary: #a8a6a0;
      --text-muted: #666460;
      --border: rgba(255,255,255,0.1);
      --border-strong: rgba(255,255,255,0.18);
      --bg-accent: #0c447c;
      --text-accent: #85b7eb;
      --border-accent: #185fa5;
      --fill-accent: #378add;
      --on-accent: #ffffff;
      --bg-success: #27500a;
      --text-success: #97c459;
      --border-success: #3b6d11;
      --bg-danger: #791f1f;
      --text-danger: #f09595;
      --border-danger: #a32d2d;
      --bg-warning: #633806;
      --text-warning: #ef9f27;
      --bg-pro: #3c3489;
      --text-pro: #afa9ec;
      --border-pro: #534ab7;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    background: var(--surface-0);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 1.5rem 1rem 3rem;
  }
  #app {
    max-width: 680px;
    margin: 0 auto;
  }
  .site-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 2rem;
    padding-bottom: 1rem;
    border-bottom: 0.5px solid var(--border);
  }
  .site-title { font-size: 18px; font-weight: 500; }
  .site-sub { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
    flex-wrap: wrap;
    gap: 8px;
  }
  .pill {
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 12px;
    font-weight: 500;
    display: inline-block;
  }
  .pill-topic { background: var(--bg-pro); color: var(--text-pro); }
  .pill-num   { background: var(--bg-accent); color: var(--text-accent); }
  .pill-streak{ background: var(--bg-success); color: var(--text-success); }
  .pbar-wrap {
    height: 5px;
    border-radius: 3px;
    background: var(--surface-1);
    overflow: hidden;
    margin-bottom: 1.25rem;
  }
  .pbar {
    height: 5px;
    border-radius: 3px;
    background: var(--fill-accent);
    transition: width .4s;
  }
  .card-scene {
    perspective: 900px;
    margin-bottom: 1.25rem;
    cursor: pointer;
  }
  .card-scene:focus-visible {
    outline: 2px solid var(--border-accent);
    border-radius: 12px;
  }
  .card-3d {
    position: relative;
    transform-style: preserve-3d;
    transition: transform .55s cubic-bezier(.4,0,.2,1);
    border-radius: 12px;
  }
  .card-3d.flipped { transform: rotateY(180deg); }
  .face {
    backface-visibility: hidden;
    border-radius: 12px;
    border: 0.5px solid var(--border);
    background: var(--surface-2);
    padding: 1.5rem 1.25rem;
    min-height: 160px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .face-back {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    transform: rotateY(180deg);
    min-height: 160px;
  }
  .face-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .6px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: .75rem;
  }
  .face-topic {
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: .5rem;
    letter-spacing: .5px;
  }
  .face-q {
    font-size: 15px;
    color: var(--text-primary);
    line-height: 1.65;
  }
  .face-hint {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: .75rem;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .face-back-inner {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.6;
  }
  .opts {
    display: flex;
    flex-direction: column;
    gap: 7px;
    margin-bottom: 1rem;
  }
  .opt {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 14px;
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    background: var(--surface-2);
    font-size: 14px;
    color: var(--text-primary);
    line-height: 1.5;
    text-align: left;
    width: 100%;
    transition: background .12s, border-color .12s;
    font-family: var(--font-sans);
  }
  .opt:hover:not(:disabled) {
    background: var(--surface-1);
    border-color: var(--border-strong);
  }
  .opt:disabled { cursor: default; }
  .opt.sel    { border-color: var(--border-accent); background: var(--bg-accent); }
  .opt.correct{ border-color: var(--border-success); background: var(--bg-success); }
  .opt.wrong  { border-color: var(--border-danger);  background: var(--bg-danger); }
  .opt-lbl { font-weight: 500; min-width: 20px; color: var(--text-secondary); }
  .opt.sel     .opt-lbl { color: var(--text-accent); }
  .opt.correct .opt-lbl { color: var(--text-success); }
  .opt.wrong   .opt-lbl { color: var(--text-danger); }
  .exp-box {
    padding: .75rem 1rem;
    background: var(--surface-1);
    border-left: 3px solid var(--border-accent);
    border-radius: 0 var(--radius) var(--radius) 0;
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.6;
    margin-bottom: 1rem;
  }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    padding: 8px 18px;
    border-radius: var(--radius);
    border: 0.5px solid var(--border-strong);
    background: transparent;
    color: var(--text-primary);
    font-size: 14px;
    cursor: pointer;
    font-family: var(--font-sans);
    transition: background .12s;
  }
  button:hover { background: var(--surface-1); }
  .btn-primary {
    background: var(--fill-accent);
    color: var(--on-accent);
    border-color: var(--fill-accent);
  }
  .btn-primary:hover { opacity: .88; background: var(--fill-accent); }
  .result-card {
    background: var(--surface-2);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 1.75rem 1.5rem;
    text-align: center;
  }
  .result-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 1.25rem 0;
  }
  .rcard {
    background: var(--surface-1);
    border-radius: var(--radius);
    padding: .75rem;
  }
  .rnum { font-size: 22px; font-weight: 500; }
  .rlbl { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
  .topic-rows { margin-top: 1.25rem; text-align: left; }
  .tr { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; font-size: 13px; }
  .tr-name { min-width: 130px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tr-track { flex: 1; height: 7px; background: var(--surface-0); border-radius: 4px; overflow: hidden; }
  .tr-fill { height: 7px; border-radius: 4px; background: var(--fill-accent); }
  .tr-pct { min-width: 32px; text-align: right; font-size: 12px; color: var(--text-secondary); }
  .mode-row { display: flex; gap: 8px; margin-bottom: 1.25rem; }
  .mode-btn {
    flex: 1;
    padding: 9px;
    border-radius: var(--radius);
    border: 0.5px solid var(--border-strong);
    background: transparent;
    font-size: 13px;
    cursor: pointer;
    font-family: var(--font-sans);
    color: var(--text-secondary);
  }
  .mode-btn.on {
    background: var(--bg-pro);
    color: var(--text-pro);
    border-color: var(--border-pro);
  }
  .filter-wrap { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1.25rem; }
  .ftag {
    padding: 4px 11px;
    border-radius: 12px;
    border: 0.5px solid var(--border-strong);
    background: transparent;
    font-size: 12px;
    cursor: pointer;
    color: var(--text-secondary);
    font-family: var(--font-sans);
  }
  .ftag.on {
    background: var(--bg-accent);
    color: var(--text-accent);
    border-color: var(--border-accent);
  }
  .err-msg { font-size: 13px; color: var(--text-danger); margin-bottom: .75rem; }
  .home-card {
    background: var(--surface-2);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
    margin-bottom: 1rem;
  }
  .home-info {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.7;
    padding: 1rem;
    background: var(--surface-1);
    border-radius: var(--radius);
    margin-top: 1rem;
  }
  .section-label {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: .5px;
    margin-bottom: .5rem;
  }
</style>
</head>

  {t:"8 Forms of Energy",q:"What energy conversion occurs in a torch?",a:"Chemical potential energy converts to electrical energy then to light and heat energy.",opts:["Light → electrical → chemical → heat","Chemical potential → electrical → light and heat","Kinetic → chemical → electrical → light","Heat → electrical → light → kinetic"]},

  {t:"Heat",q:"What happens to most materials when heated?",a:"Materials expand (increase in size) when heated.",opts:["Materials contract when heated","Materials expand when heated","Materials change colour when heated","Materials become magnetic when heated"]},
  {t:"Heat",q:"What is evaporation?",a:"Evaporation is when liquid water gains heat energy and changes into water vapour (gas).",opts:["Water vapour loses heat and becomes liquid","Liquid water gains heat and changes into water vapour","Ice melts into liquid water","Water vapour cools and forms rain"]},
  {t:"Heat",q:"What is condensation?",a:"Condensation is when water vapour loses heat and changes into liquid water.",opts:["Liquid water gains heat and becomes vapour","Water vapour loses heat and changes into liquid water","Ice melts into liquid water","Liquid water freezes into ice"]},
  {t:"Heat",q:"In which direction does heat travel?",a:"Heat travels from a hotter object to a cooler object.",opts:["Heat travels from cold to hot","Heat travels from hot to cold","Heat travels in all directions equally","Heat only travels upward"]},
  {t:"Electricity",q:"What is an electrical conductor?",a:"An electrical conductor is a material that allows electricity to flow through it (e.g. metals).",opts:["A material that stops electricity from flowing","A material that allows electricity to flow through it","A material that stores electrical energy","A material that produces electricity"]},
  {t:"Electricity",q:"What is an electrical insulator?",a:"An electrical insulator is a material that does not allow electricity to flow through it (e.g. plastic, rubber).",opts:["A material that conducts electricity well","A material that does not allow electricity to flow","A material that creates a magnetic field","A material that stores heat energy"]},
  {t:"Light",q:"What property of light does a shadow demonstrate?",a:"A shadow shows that light travels in a straight line.",opts:["Light bends around objects","Light travels in a straight line (shown by shadow formation)","Light travels in waves","Light can travel through all materials"]},
  {t:"Light",q:"What is reflection of light?",a:"Reflection is when light bounces off a surface.",opts:["Light bending as it passes through a material","Light bouncing off a surface","Light being absorbed by a dark object","Light splitting into colours"]},
  {t:"Magnets",q:"How do you make a temporary magnet by stroking?",a:"Stroke a magnetic material repeatedly in one direction with one pole of a permanent magnet.",opts:["Rub both poles alternately on the material","Stroke a magnetic material in one direction with one pole of a permanent magnet","Heat the material to make it magnetic","Wrap wire around the material"]},
  {t:"Magnets",q:"What materials are attracted to magnets?",a:"Magnetic materials: iron, steel, nickel, cobalt.",opts:["All metals including aluminium, copper, and gold","Iron, steel, nickel, and cobalt only","Only iron and steel","All dark-coloured materials"]},
  {t:"Materials",q:"What property makes a material suitable for making a raincoat?",a:"The material must be waterproof.",opts:["The material must be absorbent","The material must be waterproof","The material must be transparent","The material must be magnetic"]},
  {t:"Materials",q:"What is the strength of a material?",a:"Strength is the ability of a material to withstand a force without breaking.",opts:["The ability to stretch without breaking","The ability to withstand a force without breaking","The ability to conduct electricity","The ability to float on water"]},
  {t:"Air and Matter",q:"Why can more air be pumped into an already inflated basketball?",a:"Air (gas) can be compressed — its particles can be pushed closer together.",opts:["Air has no mass so it fits anywhere","Gas particles can be compressed — pushed closer together","Air is a liquid so it fills any space","Air particles disappear when compressed"]},
  {t:"Air and Matter",q:"What are the properties of a gas?",a:"A gas has no definite shape or volume; it fills and takes the shape of its container.",opts:["A gas has definite shape but no volume","A gas has no definite shape or volume; fills its container","A gas has definite volume but no shape","A gas cannot be compressed"]}
];

const TOPICS=[...new Set(QS.map(q=>q.t))];

function shuffle(a){return[...a].sort(()=>Math.random()-.5)}

let S={
  mode:"home",filter:"All",deck:[],idx:0,
  flipped:false,picked:null,checked:false,
  score:0,topicScore:{},streak:0,bestStreak:0,
  done:false,cardMode:"flip",showErr:false,
  currentOpts:[]
};

function startDeck(){
  let pool=S.filter==="All"?QS:QS.filter(q=>q.t===S.filter);
  S.deck=shuffle(pool);
  S.idx=0;S.flipped=false;S.picked=null;S.checked=false;
  S.score=0;S.streak=0;S.bestStreak=0;S.done=false;S.showErr=false;
  S.topicScore={};
  TOPICS.forEach(t=>{S.topicScore[t]={c:0,n:0}});
  S.mode="quiz";
  render();
}

function render(){
  const el=document.getElementById("content");
  if(S.mode==="home"){renderHome(el);return;}
  if(S.done){renderResult(el);return;}
  renderCard(el);
}

function renderHome(el){
  el.innerHTML=`
<div class="home-card">
  <div class="section-label" style="margin-bottom:.75rem">Study mode</div>
  <div class="mode-row">
    <button class="mode-btn${S.cardMode==="flip"?" on":""}" onclick="S.cardMode='flip';toggleMode(this)">
      <i class="ti ti-cards" style="font-size:16px;vertical-align:-2px;margin-right:6px" aria-hidden="true"></i>Flip + MCQ
    </button>
    <button class="mode-btn${S.cardMode==="mcq"?" on":""}" onclick="S.cardMode='mcq';toggleMode(this)">
      <i class="ti ti-list-check" style="font-size:16px;vertical-align:-2px;margin-right:6px" aria-hidden="true"></i>MCQ only
    </button>
  </div>
  <div class="section-label">Filter by topic</div>
  <div class="filter-wrap" style="margin-top:.5rem">
    ${["All",...TOPICS].map(t=>`<button class="ftag${S.filter===t?" on":""}" onclick="setFilter('${t}')">${t}</button>`).join("")}
  </div>
  <div style="margin-top:1.25rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
    <span style="font-size:13px;color:var(--text-secondary)">${S.filter==="All"?QS.length:QS.filter(q=>q.t===S.filter).length} cards in deck</span>
    <button class="btn-primary" onclick="startDeck()" style="padding:9px 22px;border-radius:var(--radius);border:none;background:var(--fill-accent);color:var(--on-accent);font-size:14px;cursor:pointer;font-family:var(--font-sans)">
      Start deck <i class="ti ti-arrow-right" style="font-size:14px;vertical-align:-2px" aria-hidden="true"></i>
    </button>
  </div>
</div>
<div class="home-info">
  <strong style="color:var(--text-primary)">Flip + MCQ:</strong> Click the card to see the answer on the back, then pick from 4 options.<br>
  <strong style="color:var(--text-primary)">MCQ only:</strong> Go straight to answering without flipping.<br><br>
  60 cards from ACS Junior, St Nicholas, and 9 other 2026 prelim papers, plus Elixir Academy AL1 recitation tables.
</div>`;
}

function toggleMode(btn){
  document.querySelectorAll(".mode-btn").forEach(b=>b.classList.remove("on"));
  btn.classList.add("on");
}

function setFilter(t){
  S.filter=t;
  document.querySelectorAll(".ftag").forEach(b=>b.classList.toggle("on",b.textContent===t));
  document.querySelector(".home-card span[style*='color:var']").textContent=(t==="All"?QS.length:QS.filter(q=>q.t===t).length)+" cards in deck";
}

function renderCard(el){
  const q=S.deck[S.idx];
  const pct=Math.round((S.idx/S.deck.length)*100);
  if(!S.checked||S.currentOpts.length===0){
    S.currentOpts=shuffle([q.a,...q.opts.filter(o=>o!==q.a)]).slice(0,4);
  }
  const opts=S.currentOpts;
  const isFlip=S.cardMode==="flip";

  const optsHTML=`<div class="opts">${opts.map((o,i)=>{
    let cls="opt";
    if(S.checked){
      if(o===q.a)cls+=" correct";
      else if(o===S.picked&&S.picked!==q.a)cls+=" wrong";
    } else if(o===S.picked) cls+=" sel";
    const lbl=String.fromCharCode(65+i);
    return `<button class="${cls}" onclick="pickOpt(${i})" ${S.checked?"disabled":""}><span class="opt-lbl">${lbl}.</span><span>${o}</span></button>`;
  }).join("")}</div>`;

  const expHTML=S.checked?`<div class="exp-box">
    <strong style="color:${S.picked===q.a?"var(--text-success)":"var(--text-danger)}">${S.picked===q.a?"Correct!":"Incorrect."}</strong>
    ${q.a}
  </div>`:"";

  const errHTML=S.showErr?`<div class="err-msg">Select an answer first.</div>`:"";

  let actionHTML="";
  if(!S.checked&&(!isFlip||S.flipped)){
    actionHTML=`<button class="btn-primary" onclick="checkAns()" style="padding:8px 18px;border-radius:var(--radius);border:none;background:var(--fill-accent);color:var(--on-accent);font-size:14px;cursor:pointer;font-family:var(--font-sans)">Check answer</button>`;
  }
  if(S.checked){
    actionHTML=`<button class="btn-primary" onclick="nextCard()" style="padding:8px 18px;border-radius:var(--radius);border:none;background:var(--fill-accent);color:var(--on-accent);font-size:14px;cursor:pointer;font-family:var(--font-sans)">${S.idx+1>=S.deck.length?"See results →":"Next card →"}</button>`;
  }

  el.innerHTML=`
<div class="topbar">
  <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
    <span class="pill pill-topic">${q.t}</span>
    <span class="pill pill-num">${S.idx+1}/${S.deck.length}</span>
    ${S.streak>1?`<span class="pill pill-streak"><i class="ti ti-flame" style="font-size:12px;vertical-align:-1px" aria-hidden="true"></i> ${S.streak}</span>`:""}
  </div>
  <span style="font-size:13px;color:var(--text-secondary)">Score: ${S.score}/${S.idx}</span>
</div>
<div class="pbar-wrap"><div class="pbar" style="width:${pct}%"></div></div>
${isFlip?`
<div class="card-scene" onclick="flipCard()" tabindex="0" role="button" aria-label="Flip card to reveal answer" onkeydown="if(event.key==='Enter'||event.key===' ')flipCard()">
  <div class="card-3d${S.flipped?" flipped":""}" id="c3d">
    <div class="face">
      <div class="face-topic">${q.t}</div>
      <div class="face-q">${q.q}</div>
      ${!S.flipped?`<div class="face-hint"><i class="ti ti-refresh" style="font-size:14px" aria-hidden="true"></i> Click to reveal answer</div>`:""}
    </div>
    <div class="face face-back">
      <div class="face-label">Answer</div>
      <div class="face-back-inner">${q.a}</div>
    </div>
  </div>
</div>
${S.flipped?optsHTML:""}`
:`<div style="background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:1.25rem;margin-bottom:1.25rem">
  <div class="face-topic">${q.t}</div>
  <div class="face-q" style="margin-bottom:1rem">${q.q}</div>
</div>
${optsHTML}`}
${errHTML}${expHTML}
<div class="actions">
  ${actionHTML}
  <button onclick="backHome()">
    <i class="ti ti-arrow-left" style="font-size:14px;vertical-align:-2px" aria-hidden="true"></i> Back
  </button>
</div>`;
}

function flipCard(){
  if(S.checked)return;
  S.flipped=!S.flipped;
  const c=document.getElementById("c3d");
  if(c) c.classList.toggle("flipped",S.flipped);
  if(S.flipped) render();
}

function pickOpt(i){
  if(S.checked)return;
  S.picked=S.currentOpts[i];
  S.showErr=false;
  render();
}

function checkAns(){
  if(S.picked===null){S.showErr=true;render();return;}
  const q=S.deck[S.idx];
  S.checked=true;S.showErr=false;
  if(S.picked===q.a){
    S.score++;S.streak++;
    if(S.streak>S.bestStreak)S.bestStreak=S.streak;
    S.topicScore[q.t].c++;
  } else {
    S.streak=0;
  }
  S.topicScore[q.t].n++;
  render();
}

function nextCard(){
  if(S.idx+1>=S.deck.length){S.done=true;render();return;}
  S.idx++;S.flipped=false;S.picked=null;S.checked=false;S.showErr=false;S.currentOpts=[];
  render();
}

function backHome(){S.mode="home";render();}

function renderResult(el){
  const total=S.deck.length;
  const pct=Math.round((S.score/total)*100);
  const grade=pct>=85?"AL1":pct>=70?"AL2":pct>=55?"AL3":pct>=45?"AL4":"Below AL4";
  const gc=pct>=85?"var(--text-success)":pct>=70?"var(--text-accent)":pct>=55?"var(--text-warning)":"var(--text-danger)";
  const rows=Object.entries(S.topicScore).filter(([,v])=>v.n>0).map(([t,v])=>{
    const p=Math.round((v.c/v.n)*100);
    return `<div class="tr">
      <span class="tr-name">${t}</span>
      <div class="tr-track"><div class="tr-fill" style="width:${p}%"></div></div>
      <span class="tr-pct">${p}%</span>
    </div>`;
  }).join("");

  el.innerHTML=`
<div class="result-card">
  <div style="font-size:13px;color:var(--text-muted);margin-bottom:.5rem">Deck complete</div>
  <div style="font-size:52px;font-weight:500;color:var(--text-primary);line-height:1">${S.score}<span style="font-size:24px;color:var(--text-secondary)">/${total}</span></div>
  <div style="font-size:15px;color:var(--text-secondary);margin:.5rem 0 1.25rem">${pct}% — <span style="color:${gc};font-weight:500">${grade}</span></div>
  <div class="result-grid">
    <div class="rcard"><div class="rnum" style="color:var(--text-success)">${S.score}</div><div class="rlbl">Correct</div></div>
    <div class="rcard"><div class="rnum" style="color:var(--text-danger)">${total-S.score}</div><div class="rlbl">Wrong</div></div>
    <div class="rcard"><div class="rnum">${S.bestStreak}</div><div class="rlbl">Best streak</div></div>
  </div>
  ${rows?`<div class="topic-rows">${rows}</div>`:""}
  <div style="display:flex;gap:8px;justify-content:center;margin-top:1.5rem;flex-wrap:wrap">
    <button onclick="startDeck()" style="padding:9px 22px;border-radius:var(--radius);border:none;background:var(--fill-accent);color:var(--on-accent);font-size:14px;cursor:pointer;font-family:var(--font-sans)">
      Retry deck <i class="ti ti-refresh" style="font-size:14px;vertical-align:-2px" aria-hidden="true"></i>
    </button>
    <button onclick="backHome()">Change filter</button>
  </div>
</div>`;
}

render();
</script>
</body>
</html>
