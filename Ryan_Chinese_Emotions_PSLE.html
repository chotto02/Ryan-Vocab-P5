<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ryan的华文情感词语 · PSLE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fdf6ee;--surface:#fff;--surface2:#faf5ee;--border:#e8ddd0;--border-strong:#d4c4b0;
  --text:#2c1810;--text-sec:#6b4c3b;--text-muted:#a08070;
  --red:#c0392b;--red-bg:#fef5f4;--red-border:#f5c6c2;
  --amber:#c77d0a;--amber-bg:#fefbf0;--amber-border:#f5e4b0;
  --green:#1a7a4a;--green-bg:#f0fdf6;--green-border:#b8f0d0;
  --blue:#1a5fa8;--blue-bg:#f0f6fe;--blue-border:#b8d4f5;
  --purple:#6b2fa0;--purple-bg:#f8f0fe;--purple-border:#d8b8f5;
  --teal:#0d7a6a;--teal-bg:#f0fdf9;--teal-border:#b8f0e8;
  --orange:#d35400;--orange-bg:#fff7ed;--orange-border:#fed7aa;
  --pink:#b83280;--pink-bg:#fef0f8;--pink-border:#f5b8e0;
  --gold:#a07820;--gold-bg:#fffbf0;--gold-border:#f0dfa0;
  --radius:10px;--shadow:0 2px 8px rgba(100,60,20,.10)
}
body{font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.7}
.page{max-width:820px;margin:0 auto;padding:1.5rem 1.25rem 4rem}
.hero{text-align:center;padding:1.5rem 1rem 1rem;margin-bottom:1.25rem}
.hero-badge{display:inline-block;font-size:.75rem;font-weight:700;padding:4px 14px;border-radius:99px;background:var(--red-bg);color:var(--red);border:1px solid var(--red-border);margin-bottom:.75rem}
.hero h1{font-family:'Noto Serif SC',serif;font-size:1.75rem;font-weight:700;color:var(--text);margin-bottom:.25rem}
.hero p{font-size:.875rem;color:var(--text-muted)}
.hero-name{color:var(--red);font-weight:700}

/* ── Voice debug box ── */
.voice-box{background:var(--surface);border:2px solid var(--border);border-radius:12px;padding:16px;margin-bottom:1.25rem;box-shadow:var(--shadow)}
.voice-box h3{font-size:.9rem;font-weight:700;color:var(--text-sec);margin-bottom:10px}
#voiceList{font-size:.8rem;color:var(--text-sec);margin-bottom:10px;line-height:1.8;max-height:120px;overflow-y:auto;background:var(--surface2);padding:8px;border-radius:6px;border:1px solid var(--border)}
.vrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.voice-sel{font-size:.8rem;font-family:inherit;padding:6px 10px;border-radius:var(--radius);border:1px solid var(--border-strong);background:var(--surface);color:var(--text);cursor:pointer;flex:1;min-width:180px}
.speed-sel{font-size:.8rem;font-family:inherit;padding:6px 8px;border-radius:var(--radius);border:1px solid var(--border-strong);background:var(--surface);color:var(--text);cursor:pointer}
.test-btn{padding:8px 18px;border-radius:var(--radius);background:var(--red);color:#fff;border:none;font-family:inherit;font-size:.85rem;font-weight:700;cursor:pointer}
.stop-btn{padding:8px 18px;border-radius:var(--radius);background:var(--surface2);color:var(--text-sec);border:1px solid var(--border-strong);font-family:inherit;font-size:.85rem;font-weight:700;cursor:pointer}
.status-pill{display:inline-block;font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:99px}
.s-ok{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.s-warn{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border)}
.s-err{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.install-guide{font-size:.75rem;color:var(--text-muted);line-height:1.8;margin-top:8px}
.install-guide strong{color:var(--text-sec)}

/* speaking pulse */
.speaking-badge{display:none;align-items:center;gap:6px;font-size:.75rem;color:var(--red);font-weight:700;background:var(--red-bg);padding:5px 10px;border-radius:99px;border:1px solid var(--red-border)}
.speaking-badge.show{display:inline-flex}
.bars{display:flex;gap:2px;align-items:center;height:14px}
.bars span{width:3px;background:var(--red);border-radius:2px;animation:eq .8s infinite ease-in-out;display:block}
.bars span:nth-child(1){height:5px}.bars span:nth-child(2){height:10px;animation-delay:.1s}
.bars span:nth-child(3){height:14px;animation-delay:.2s}.bars span:nth-child(4){height:10px;animation-delay:.3s}
.bars span:nth-child(5){height:5px;animation-delay:.4s}
@keyframes eq{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}

/* tabs */
.tab-nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1.5rem}
.tab-btn{padding:8px 16px;border-radius:99px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text-sec);font-family:inherit;font-size:.8125rem;font-weight:700;cursor:pointer;transition:all .15s}
.tab-btn.active{background:var(--red);color:#fff;border-color:var(--red)}
.tab-section{display:none}.tab-section.active{display:block}

/* section head */
.section-head{display:flex;align-items:center;gap:12px;margin-bottom:1.25rem;padding-bottom:10px;border-bottom:2px solid var(--border)}
.section-icon{font-size:1.4rem}
.section-title{font-family:'Noto Serif SC',serif;font-size:1.1rem;font-weight:700}
.section-sub{font-size:.8rem;color:var(--text-muted);margin-left:auto}

/* card grid */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;margin-bottom:1.75rem}
.phrase-card{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:1.1rem;box-shadow:var(--shadow);position:relative;transition:border-color .15s}
.phrase-card.active-card{border-color:var(--red);box-shadow:0 0 0 3px var(--red-border)}
.phrase-num{position:absolute;top:10px;right:12px;font-size:.68rem;font-weight:700;color:var(--text-muted)}
.emo-tag{display:inline-block;font-size:.65rem;font-weight:700;padding:2px 8px;border-radius:99px;margin-bottom:7px}
.phrase-chinese{font-family:'Noto Serif SC',serif;font-size:1.45rem;font-weight:700;color:var(--text);margin-bottom:3px}
.phrase-pinyin{font-size:.72rem;color:var(--text-muted);font-style:italic;margin-bottom:6px}
.phrase-meaning{font-size:.8rem;color:var(--text-sec);background:var(--surface2);border-radius:6px;padding:5px 9px;margin-bottom:.7rem;border-left:3px solid var(--border-strong)}
.phrase-example{font-size:.875rem;color:var(--text);line-height:1.8;border-top:1px solid var(--border);padding-top:.7rem}
.speak-btn{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:700;padding:6px 14px;border-radius:99px;border:1.5px solid var(--red-border);background:var(--red-bg);color:var(--red);cursor:pointer;margin-top:9px;font-family:inherit;transition:all .15s}
.speak-btn:hover,.speak-btn.on{background:var(--red);color:#fff;border-color:var(--red)}

.emo-anger{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.emo-fear{background:var(--purple-bg);color:var(--purple);border:1px solid var(--purple-border)}
.emo-nervous{background:var(--orange-bg);color:var(--orange);border:1px solid var(--orange-border)}
.emo-anxious{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border)}
.emo-sad{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-border)}
.emo-disappointed{background:var(--teal-bg);color:var(--teal);border:1px solid var(--teal-border)}
.emo-happy{background:var(--gold-bg);color:var(--gold);border:1px solid var(--gold-border)}
.emo-proud{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.emo-ashamed{background:var(--pink-bg);color:var(--pink);border:1px solid var(--pink-border)}
.emo-regret{background:var(--purple-bg);color:var(--purple);border:1px solid var(--purple-border)}
.emo-shocked{background:var(--orange-bg);color:var(--orange);border:1px solid var(--orange-border)}
.emo-relieved{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.emo-wronged{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-border)}
.emo-jealous{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.emo-complex{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border)}

.play-all-wrap{display:flex;align-items:center;gap:10px;margin-bottom:1rem;flex-wrap:wrap}
.play-all-btn{display:flex;align-items:center;gap:7px;padding:9px 18px;border-radius:var(--radius);border:1px solid var(--red-border);background:var(--red-bg);color:var(--red);font-family:inherit;font-size:.875rem;font-weight:700;cursor:pointer;transition:all .15s}
.play-all-btn:hover,.play-all-btn.on{background:var(--red);color:#fff}
.prog-bar{flex:1;height:5px;background:var(--border);border-radius:99px;overflow:hidden;min-width:60px}
.prog-fill{height:100%;background:var(--red);border-radius:99px;transition:width .4s;width:0%}
.prog-lbl{font-size:.72rem;color:var(--text-muted);white-space:nowrap}

.essay-wrap{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.5rem;box-shadow:var(--shadow)}
.essay-title{font-family:'Noto Serif SC',serif;font-size:1.3rem;font-weight:700;color:var(--red);text-align:center;margin-bottom:.2rem}
.essay-sub{font-size:.8rem;color:var(--text-muted);text-align:center;margin-bottom:1.25rem}
.essay-para-wrap{background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;padding:1rem 1.1rem .8rem;margin-bottom:10px;transition:border-color .15s}
.essay-para-wrap.active-card{border-color:var(--red)}
.para-meta{font-size:.68rem;font-weight:700;color:var(--text-muted);margin-bottom:6px}
.essay-para{font-size:.9375rem;line-height:2;color:var(--text)}

.quiz-wrap{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.5rem;box-shadow:var(--shadow)}
.q-meta{font-size:.72rem;font-weight:700;color:var(--text-muted);margin-bottom:.75rem}
.q-text{font-family:'Noto Serif SC',serif;font-size:1.05rem;font-weight:700;margin-bottom:1.1rem;line-height:1.6}
.q-opts{display:grid;gap:9px}
.q-opt{width:100%;text-align:left;padding:11px 15px;border-radius:var(--radius);border:1.5px solid var(--border);background:var(--surface2);color:var(--text);font-family:inherit;font-size:.9rem;cursor:pointer;display:flex;gap:10px;align-items:center;transition:all .15s}
.q-opt:hover:not(:disabled){background:var(--red-bg);border-color:var(--red-border)}
.q-opt:disabled{cursor:default}
.q-opt.correct{background:var(--green-bg);border-color:var(--green);color:var(--green);font-weight:700}
.q-opt.wrong{background:var(--red-bg);border-color:var(--red);color:var(--red);font-weight:700}
.opt-lbl{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;flex-shrink:0}
.q-fb{display:none;margin-top:1rem;padding:10px 14px;border-radius:var(--radius);font-size:.875rem;line-height:1.6}
.q-fb.show{display:block}
.q-next{margin-top:1rem;padding:10px 22px;border-radius:var(--radius);background:var(--red);color:#fff;border:none;font-family:inherit;font-size:.875rem;font-weight:700;cursor:pointer}

@media(max-width:540px){.card-grid{grid-template-columns:1fr}.page{padding:1rem .75rem 3rem}.hero h1{font-size:1.35rem}}
</style>
</head>
<body>
<div class="page">

<div class="hero">
  <div class="hero-badge">PSLE 华文备考 2026</div>
  <h1>情感词语学习册</h1>
  <p>为 <span class="hero-name">Ryan</span> 特别整理 · 88个情感词语 + 范文朗读</p>
</div>

<!-- Voice setup box -->
<div class="voice-box">
  <h3>🔊 朗读设置 &nbsp;<span id="statusPill" class="status-pill s-warn">检测中…</span>&nbsp;<span class="speaking-badge" id="speakBadge"><div class="bars"><span></span><span></span><span></span><span></span><span></span></div>朗读中…</span></h3>
  <div id="voiceList">正在检测声音…</div>
  <div class="vrow">
    <select class="voice-sel" id="voiceSel" onchange="pickVoice()">
      <option>— 加载中 —</option>
    </select>
    <select class="speed-sel" id="speedSel">
      <option value="0.5">很慢</option>
      <option value="0.7" selected>慢速</option>
      <option value="0.85">正常</option>
      <option value="1.0">快速</option>
    </select>
    <button class="test-btn" onclick="testSpeak()">🔊 测试</button>
    <button class="stop-btn" onclick="stopAll()">■ 停止</button>
  </div>
  <div class="install-guide" id="installGuide"></div>
</div>

<div class="tab-nav">
  <button class="tab-btn active" onclick="switchTab('phrases',this)">📚 情感词语（88个）</button>
  <button class="tab-btn" onclick="switchTab('essay',this)">📖 范文朗读</button>
  <button class="tab-btn" onclick="switchTab('quiz',this)">✏️ 快速测试</button>
</div>

<div class="tab-section active" id="tab-phrases">
  <div class="play-all-wrap">
    <button class="play-all-btn" id="playAllBtn" onclick="togglePlayAll()">▶ 全部朗读</button>
    <div class="prog-bar"><div class="prog-fill" id="progFill"></div></div>
    <span class="prog-lbl" id="progLbl">0 / 88</span>
  </div>
  <div id="phrase-sections"></div>
</div>

<div class="tab-section" id="tab-essay">
  <div class="essay-wrap">
    <div class="essay-title">《沉迷手机惹的祸》</div>
    <div class="essay-sub">钟老师范文 · 点击段落旁按钮朗读</div>
    <div class="play-all-wrap">
      <button class="play-all-btn" id="playEssayBtn" onclick="toggleEssayPlay()">▶ 朗读全文</button>
      <div class="prog-bar"><div class="prog-fill" id="essayProg"></div></div>
    </div>
    <div id="essay-content"></div>
  </div>
</div>

<div class="tab-section" id="tab-quiz">
  <div class="quiz-wrap" id="quizWrap"></div>
</div>

</div><!-- page -->

<script>
/* ═══════════════════════════════════════════════════
   VOICE ENGINE
   Three-layer fallback:
   1. Web Speech API with detected Chinese voice
   2. Web Speech API with lang=zh-CN (browser picks voice)
   3. Show a clear install guide to the user
═══════════════════════════════════════════════════ */
const SY = window.speechSynthesis;
let allVoices = [];
let selectedVoice = null;
let isSpeaking = false;
let playAllActive = false, playAllIdx = 0;
let essayActive = false,   essayIdx   = 0;

/* Load voices — retry because Chrome loads them async */
function loadVoices() {
  if (!SY) {
    setStatus('err','浏览器不支持朗读');
    document.getElementById('installGuide').innerHTML =
      '<strong>请使用 Google Chrome 或 Microsoft Edge 打开此文件。</strong>';
    return;
  }
  const raw = SY.getVoices();

  // Classify: zh first, then everything
  const zh = raw.filter(v =>
    v.lang.startsWith('zh') ||
    /chinese|mandarin|普通|国语|meijia|tingting|sinji|huihui|yaoyao|kangkang/i.test(v.name)
  );
  allVoices = zh.length ? zh : raw;

  // Populate dropdown
  const sel = document.getElementById('voiceSel');
  sel.innerHTML = '';
  allVoices.forEach((v, i) => {
    const o = document.createElement('option');
    o.value = i;
    o.textContent = v.name + ' [' + v.lang + ']' + (v.localService ? ' ✓' : '');
    sel.appendChild(o);
  });

  // Pick best voice
  selectedVoice = (zh.length ? zh : raw)[0] || null;

  // Status display
  const listEl = document.getElementById('voiceList');
  if (zh.length) {
    setStatus('ok', '✅ 找到 ' + zh.length + ' 个中文声音');
    listEl.innerHTML = zh.map(v =>
      `<div>${v.localService?'✓':'☁'} <strong>${v.name}</strong> (${v.lang})</div>`
    ).join('');
    document.getElementById('installGuide').textContent =
      '✓ = 本机声音（离线可用）· ☁ = 在线声音。请点击测试按钮确认声音正常。';
  } else if (raw.length) {
    setStatus('warn', '⚠️ 未找到中文声音，使用英文声音');
    listEl.textContent = '找到 ' + raw.length + ' 个声音，但没有中文声音。请按以下指引安装。';
    showInstallGuide();
  } else {
    setStatus('err', '❌ 没有任何声音');
    listEl.textContent = '未找到任何朗读声音。';
    showInstallGuide();
  }
}

function showInstallGuide() {
  document.getElementById('installGuide').innerHTML = `
<strong>如何安装中文普通话声音：</strong><br>
📱 <strong>iPad / iPhone：</strong>设置 → 辅助功能 → 朗读内容 → 声音 → 中文（中国大陆）→ 下载"普通话"声音 → 回到此页面刷新<br>
💻 <strong>Mac：</strong>系统设置 → 辅助功能 → 朗读内容 → 系统声音 → 管理声音 → 选择"普通话 (Meijia)" → 下载<br>
🖥️ <strong>Windows：</strong>设置 → 时间和语言 → 语音 → 管理声音 → 添加"中文（普通话，中国）" → 下载完成后刷新<br>
安装后请刷新页面（F5）并重新点击测试按钮。`;
}

function setStatus(type, msg) {
  const el = document.getElementById('statusPill');
  el.className = 'status-pill s-' + type;
  el.textContent = msg;
}

function pickVoice() {
  const i = +document.getElementById('voiceSel').value;
  selectedVoice = allVoices[i] || null;
}

function getRate() { return parseFloat(document.getElementById('speedSel').value) || 0.7; }

/* Core speak — Web Speech API with zh-CN fallback */
function speak(text, onDone) {
  if (!SY) { if (onDone) onDone(); return; }
  SY.cancel();

  // Split at 150 chars on sentence boundary to avoid Chrome cutoff bug
  const chunks = splitChunks(text, 150);
  let i = 0;

  function next() {
    if (i >= chunks.length) {
      setSpeaking(false);
      clearHighlights();
      if (onDone) onDone();
      return;
    }
    const utt = new SpeechSynthesisUtterance(chunks[i++]);
    // Always set lang to zh-CN — even if no zh voice, browser may pick one
    utt.lang  = selectedVoice ? selectedVoice.lang : 'zh-CN';
    utt.rate  = getRate();
    utt.pitch = 1;
    utt.volume = 1;
    if (selectedVoice) utt.voice = selectedVoice;
    utt.onend   = next;
    utt.onerror = next;
    SY.speak(utt);

    // Chrome keepalive: pause/resume every 10s to prevent silent hang
    const t = setInterval(() => {
      if (!SY.speaking) { clearInterval(t); return; }
      SY.pause(); SY.resume();
    }, 10000);
    utt.onend = () => { clearInterval(t); next(); };
    utt.onerror = () => { clearInterval(t); next(); };
  }

  setSpeaking(true);
  next();
}

function splitChunks(text, max) {
  if (text.length <= max) return [text];
  const res = [];
  let s = text;
  while (s.length > max) {
    let cut = max;
    for (let i = max - 1; i > max - 50; i--) {
      if ('。！？，'.includes(s[i])) { cut = i + 1; break; }
    }
    res.push(s.slice(0, cut));
    s = s.slice(cut);
  }
  if (s) res.push(s);
  return res;
}

function stopAll() {
  playAllActive = false; essayActive = false;
  if (SY) SY.cancel();
  setSpeaking(false);
  clearHighlights();
  resetPlayAllBtn(); resetEssayBtn();
}

function setSpeaking(v) {
  isSpeaking = v;
  document.getElementById('speakBadge').classList.toggle('show', v);
}

function clearHighlights() {
  document.querySelectorAll('.active-card').forEach(c => c.classList.remove('active-card'));
  document.querySelectorAll('.speak-btn.on').forEach(b => { b.textContent = '🔊 朗读'; b.classList.remove('on'); });
  document.querySelectorAll('[id^="epb-"].on').forEach(b => { b.textContent = '🔊 朗读此段'; b.classList.remove('on'); });
}

function testSpeak() {
  stopAll();
  speak('你好！这是朗读测试。加油，Ryan！', null);
}

/* Init with retries */
function initVoices() {
  if (!SY) { setStatus('err','不支持朗读'); return; }
  loadVoices();
  SY.onvoiceschanged = loadVoices;
  [100, 500, 1000, 2000].forEach(t => setTimeout(loadVoices, t));
}

/* ═══════════════════════════════════════
   DATA
═══════════════════════════════════════ */
const SECTIONS = [
  {id:'anger',   icon:'😡',t:'生气 · Anger'},
  {id:'fear',    icon:'😨',t:'害怕 · Fear'},
  {id:'nervous', icon:'😰',t:'紧张 · Nervous'},
  {id:'anxious', icon:'😟',t:'着急·担心 · Anxious & Worried'},
  {id:'sad',     icon:'😢',t:'伤心·感动 · Sad & Touched'},
  {id:'disappointed',icon:'😞',t:'失望 · Disappointed'},
  {id:'happy',   icon:'😄',t:'开心·兴奋 · Happy & Excited'},
  {id:'proud',   icon:'😤',t:'骄傲·自信 · Proud & Confident'},

const CC={anger:'emo-anger',fear:'emo-fear',nervous:'emo-nervous',anxious:'emo-anxious',sad:'emo-sad',disappointed:'emo-disappointed',happy:'emo-happy',proud:'emo-proud',ashamed:'emo-ashamed',regret:'emo-regret',shocked:'emo-shocked',relieved:'emo-relieved',wronged:'emo-wronged',jealous:'emo-jealous',complex:'emo-complex'};

/* build cards */
function buildPhrases(){
  const con=document.getElementById('phrase-sections');
  SECTIONS.forEach(sec=>{
    const phrases=P.filter(p=>p.c===sec.id);
    const wrap=document.createElement('div');
    wrap.innerHTML=`<div class="section-head"><span class="section-icon">${sec.icon}</span><span class="section-title">${sec.t}</span><span class="section-sub">${phrases.length} 个词语</span></div>`;
    const grid=document.createElement('div');grid.className='card-grid';
    phrases.forEach(p=>{
      const gi=P.indexOf(p);
      const d=document.createElement('div');d.className='phrase-card';d.id='c'+gi;
      d.innerHTML=`<span class="phrase-num">${p.n}</span>
        <span class="emo-tag ${CC[p.c]}">${p.tag}</span>
        <div class="phrase-chinese">${p.zh}</div>
        <div class="phrase-pinyin">${p.py}</div>
        <div class="phrase-meaning">意思：${p.m}</div>
        <div class="phrase-example">${p.e}</div>
        <button class="speak-btn" id="sb${gi}" onclick="speakCard(${gi})">🔊 朗读</button>`;
      grid.appendChild(d);
    });
    wrap.appendChild(grid);con.appendChild(wrap);
  });
}

function speakCard(i){
  const p=P[i],card=document.getElementById('c'+i),btn=document.getElementById('sb'+i);
  if(isSpeaking&&card&&card.classList.contains('active-card')){stopAll();return;}
  stopAll();clearHighlights();
  if(card){card.classList.add('active-card');card.scrollIntoView({behavior:'smooth',block:'nearest'});}
  if(btn){btn.textContent='■ 停止';btn.classList.add('on');}
  const pct=Math.round(((i+1)/P.length)*100);
  document.getElementById('progFill').style.width=pct+'%';
  document.getElementById('progLbl').textContent=(i+1)+' / '+P.length;
  speak(p.zh+'。意思是：'+p.m+'。例句：'+p.e,()=>{
    if(card)card.classList.remove('active-card');
    if(btn){btn.textContent='🔊 朗读';btn.classList.remove('on');}
    if(playAllActive){
      playAllIdx=i+1;
      if(playAllIdx<P.length)setTimeout(()=>speakCard(playAllIdx),800);
      else{playAllActive=false;resetPlayAllBtn();}
    }
  });
}
function togglePlayAll(){
  if(playAllActive){playAllActive=false;stopAll();return;}
  playAllActive=true;playAllIdx=0;
  const b=document.getElementById('playAllBtn');b.textContent='■ 停止全部';b.classList.add('on');
  speakCard(0);
}
function resetPlayAllBtn(){const b=document.getElementById('playAllBtn');if(b){b.textContent='▶ 全部朗读';b.classList.remove('on');}}

function buildEssay(){
  const c=document.getElementById('essay-content');
  ESSAY.forEach((para,i)=>{
    const d=document.createElement('div');d.className='essay-para-wrap';d.id='ep'+i;
    d.innerHTML=`<div class="para-meta">第 ${i+1} 段</div><p class="essay-para">${para}</p>
      <button class="speak-btn" id="epb-${i}" onclick="speakEssayPara(${i})">🔊 朗读此段</button>`;
    c.appendChild(d);
  });
}
function speakEssayPara(i){
  const card=document.getElementById('ep'+i),btn=document.getElementById('epb-'+i);
  if(isSpeaking&&card&&card.classList.contains('active-card')){stopAll();return;}
  stopAll();clearHighlights();essayIdx=i;
  if(card){card.classList.add('active-card');card.scrollIntoView({behavior:'smooth',block:'nearest'});}

    if(card)card.classList.remove('active-card');

function toggleEssayPlay(){

  speakEssayPara(0);
}
function resetEssayBtn(){const b=document.getElementById('playEssayBtn');if(b){b.textContent='▶ 朗读全文';b.classList.remove('on');}}

let qDeck=[],qIdx=0,qCorrect=0,qWrong=0;
function buildQuiz(){qDeck=[...QUIZ].sort(()=>Math.random()-.5);qIdx=0;qCorrect=0;qWrong=0;renderQuiz();}
function renderQuiz(){
  const w=document.getElementById('quizWrap');
  if(qIdx>=qDeck.length){
    const pct=Math.round((qCorrect/qDeck.length)*100);
    w.innerHTML=`<div style="text-align:center;padding:2rem"><div style="font-size:3rem">${pct>=80?'🌟🌟🌟':pct>=60?'⭐⭐':'⭐'}</div>
      <div style="font-family:'Noto Serif SC',serif;font-size:1.6rem;font-weight:700;color:var(--red);margin:.5rem 0">${pct}%</div>
      <div style="color:var(--text-sec);margin-bottom:.5rem">${qCorrect} 对 / ${qDeck.length} 题</div>
      <div style="color:var(--text-muted);margin-bottom:2rem">${pct>=80?'太棒了！Ryan加油！💪':pct>=60?'不错！继续练习！':'再来一次，你可以的！'}</div>
      <button onclick="buildQuiz()" style="padding:11px 28px;border-radius:var(--radius);background:var(--red);color:#fff;border:none;font-family:inherit;font-size:.9rem;font-weight:700;cursor:pointer">🔄 再来一次</button></div>`;
    speak(pct>=80?'太棒了！'+qCorrect+'题答对。':'你答对了'+qCorrect+'题。继续加油！',null);
    return;
  }
  const q=qDeck[qIdx];
  w.innerHTML=`<div class="q-meta">第 ${qIdx+1} 题 / 共 ${qDeck.length} 题 · ✅ ${qCorrect} 对 ❌ ${qWrong} 错</div>
    <div class="q-text">${q.q}</div>
    <div class="q-opts">${q.opts.map((o,i)=>`<button class="q-opt" id="qo${i}" onclick="pickQuiz(${i})"><span class="opt-lbl">${['A','B','C','D'][i]}</span>${o}</button>`).join('')}</div>
    <div class="q-fb" id="qfb"></div><div id="qnext"></div>`;
  speak(q.q,null);
}
function pickQuiz(i){
  const q=qDeck[qIdx];
  [0,1,2,3].forEach(j=>{const b=document.getElementById('qo'+j);if(b)b.disabled=true;});
  const cb=document.getElementById('qo'+q.ans),pb=document.getElementById('qo'+i);
  if(cb)cb.classList.add('correct');
  if(i!==q.ans&&pb)pb.classList.add('wrong');
  const ok=i===q.ans;
  if(ok)qCorrect++;else qWrong++;
  const fb=document.getElementById('qfb');fb.classList.add('show');
  fb.style.cssText='display:block;background:'+(ok?'var(--green-bg)':'var(--red-bg)')+';border-left:3px solid '+(ok?'var(--green)':'var(--red)')+';padding:10px 14px;border-radius:var(--radius);margin-top:1rem;font-size:.875rem';
  fb.innerHTML=ok?'✅ 答对了！很棒，Ryan！':'❌ 答错了。正确答案是：<strong style="color:var(--green)">'+q.opts[q.ans]+'</strong>';
  speak(ok?'答对了！很棒！':'答错了。正确答案是：'+q.opts[q.ans],null);
  document.getElementById('qnext').innerHTML=`<button class="q-next" onclick="qIdx++;renderQuiz()">${qIdx+1>=qDeck.length?'查看成绩 🎉':'下一题 →'}</button>`;
}

function switchTab(name,btn){
  stopAll();
  document.querySelectorAll('.tab-section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  if(btn)btn.classList.add('active');
  if(name==='quiz'&&qDeck.length===0)buildQuiz();
}
