<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ryan的华文情感词语 · PSLE 备考</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;700&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fdf6ee;--surface:#fff;--surface2:#faf5ee;--border:#e8ddd0;--border-strong:#d4c4b0;
  --text:#2c1810;--text-sec:#6b4c3b;--text-muted:#a08070;
  --red:#c0392b;--red-bg:#fef5f4;--red-border:#f5c6c2;
  --orange:#d35400;--orange-bg:#fef9f4;--orange-border:#f5d5b8;
  --amber:#c77d0a;--amber-bg:#fefbf0;--amber-border:#f5e4b0;
  --green:#1a7a4a;--green-bg:#f0fdf6;--green-border:#b8f0d0;
  --blue:#1a5fa8;--blue-bg:#f0f6fe;--blue-border:#b8d4f5;
  --purple:#6b2fa0;--purple-bg:#f8f0fe;--purple-border:#d8b8f5;
  --teal:#0d7a6a;--teal-bg:#f0fdf9;--teal-border:#b8f0e8;
  --pink:#b83280;--pink-bg:#fef0f8;--pink-border:#f5b8e0;
  --gold:#a07820;--gold-bg:#fffbf0;--gold-border:#f0dfa0;
  --radius:10px;--shadow:0 2px 8px rgba(100,60,20,.10),0 1px 3px rgba(100,60,20,.08)
}
body{font-family:'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.7}
.page{max-width:820px;margin:0 auto;padding:1.5rem 1.25rem 4rem}

/* Hero */
.hero{text-align:center;padding:1.5rem 1rem 1rem;margin-bottom:1.25rem}
.hero-badge{display:inline-block;font-size:.75rem;font-weight:700;padding:4px 14px;border-radius:99px;background:var(--red-bg);color:var(--red);border:1px solid var(--red-border);margin-bottom:.75rem}
.hero h1{font-family:'Noto Serif SC',serif;font-size:1.75rem;font-weight:700;color:var(--text);margin-bottom:.25rem}
.hero p{font-size:.875rem;color:var(--text-muted)}
.hero-name{color:var(--red);font-weight:700}

/* Voice debug panel */
.voice-panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:1.25rem;box-shadow:var(--shadow)}
.voice-panel-title{font-size:.8rem;font-weight:700;color:var(--text-sec);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.voice-status{font-size:.75rem;padding:4px 10px;border-radius:99px;font-weight:600}
.voice-status.ok{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.voice-status.warn{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border)}
.voice-status.err{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.voice-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.voice-lbl{font-size:.75rem;color:var(--text-muted);white-space:nowrap}
.voice-sel,.speed-sel{font-size:.8rem;font-family:inherit;padding:6px 10px;border-radius:var(--radius);border:1px solid var(--border-strong);background:var(--surface);color:var(--text);cursor:pointer}
.voice-sel{flex:1;min-width:200px}
.test-btn{padding:7px 16px;border-radius:var(--radius);border:1px solid var(--red-border);background:var(--red-bg);color:var(--red);font-family:inherit;font-size:.8rem;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap}
.test-btn:hover{background:var(--red);color:#fff}
.stop-all-btn{padding:7px 16px;border-radius:var(--radius);border:1px solid var(--border-strong);background:var(--surface2);color:var(--text-sec);font-family:inherit;font-size:.8rem;font-weight:700;cursor:pointer;white-space:nowrap}

/* Speaking indicator */
.speaking-badge{display:none;align-items:center;gap:6px;font-size:.75rem;color:var(--red);font-weight:700;background:var(--red-bg);padding:5px 10px;border-radius:99px;border:1px solid var(--red-border)}
.speaking-badge.show{display:flex}
.bars{display:flex;gap:2px;align-items:center;height:14px}
.bars span{width:3px;background:var(--red);border-radius:2px;animation:eq .8s infinite ease-in-out;display:block}
.bars span:nth-child(1){height:5px;animation-delay:0s}.bars span:nth-child(2){height:10px;animation-delay:.1s}
.bars span:nth-child(3){height:14px;animation-delay:.2s}.bars span:nth-child(4){height:10px;animation-delay:.3s}
.bars span:nth-child(5){height:5px;animation-delay:.4s}
@keyframes eq{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}

/* Tabs */
.tab-nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1.5rem}
.tab-btn{padding:8px 16px;border-radius:99px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text-sec);font-family:inherit;font-size:.8125rem;font-weight:700;cursor:pointer;transition:all .15s}
.tab-btn:hover{background:var(--surface2)}
.tab-btn.active{background:var(--red);color:#fff;border-color:var(--red)}
.tab-section{display:none}.tab-section.active{display:block}

/* Section heading */
.section-head{display:flex;align-items:center;gap:12px;margin-bottom:1.25rem;padding-bottom:10px;border-bottom:2px solid var(--border)}
.section-icon{font-size:1.4rem}
.section-title{font-family:'Noto Serif SC',serif;font-size:1.1rem;font-weight:700}
.section-sub{font-size:.8rem;color:var(--text-muted);margin-left:auto}

/* Card grid */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;margin-bottom:1.75rem}

/* Phrase card */
.phrase-card{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:1.1rem 1.1rem .9rem;box-shadow:var(--shadow);position:relative;transition:border-color .15s}
.phrase-card.active-card{border-color:var(--red);box-shadow:0 0 0 3px var(--red-border)}
.phrase-num{position:absolute;top:10px;right:12px;font-size:.68rem;font-weight:700;color:var(--text-muted)}
.emo-tag{display:inline-block;font-size:.65rem;font-weight:700;padding:2px 8px;border-radius:99px;margin-bottom:7px}
.phrase-chinese{font-family:'Noto Serif SC',serif;font-size:1.45rem;font-weight:700;color:var(--text);line-height:1.3;margin-bottom:3px}
.phrase-pinyin{font-size:.72rem;color:var(--text-muted);letter-spacing:.04em;margin-bottom:6px;font-style:italic}
.phrase-meaning{font-size:.8rem;color:var(--text-sec);background:var(--surface2);border-radius:6px;padding:5px 9px;margin-bottom:.7rem;border-left:3px solid var(--border-strong)}
.phrase-example{font-size:.875rem;color:var(--text);line-height:1.8;border-top:1px solid var(--border);padding-top:.7rem}
.card-speak-btn{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;padding:5px 12px;border-radius:99px;border:1.5px solid var(--red-border);background:var(--red-bg);color:var(--red);cursor:pointer;margin-top:9px;transition:all .15s;font-family:inherit}
.card-speak-btn:hover,.card-speak-btn.on{background:var(--red);color:#fff;border-color:var(--red)}

/* Category colours */
.emo-anger{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.emo-fear{background:var(--purple-bg);color:var(--purple);border:1px solid var(--purple-border)}
.emo-nervous{background:var(--orange-bg);color:var(--orange);border:1px solid var(--orange-border)}
.emo-anxious{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border)}
.emo-sad{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-border)}
.emo-disappointed{background:var(--teal-bg);color:var(--teal);border:1px solid var(--teal-border)}
.emo-happy{background:var(--gold-bg);color:var(--gold);border:1px solid var(--gold-border)}
.emo-proud{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.emo-ashamed{background:var(--pink-bg);color:var(--pink);border:1px solid var(--pink-border)}
.emo-regret{background:var(--purple-bg);color:var(--purple);border:1px solid var(--purple-border)}
.emo-shocked{background:var(--orange-bg);color:var(--orange);border:1px solid var(--orange-border)}
.emo-relieved{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.emo-wronged{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-border)}
.emo-jealous{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.emo-complex{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border)}

/* Play all */
.play-all-wrap{display:flex;align-items:center;gap:10px;margin-bottom:1rem;flex-wrap:wrap}
.play-all-btn{display:flex;align-items:center;gap:7px;padding:9px 18px;border-radius:var(--radius);border:1px solid var(--red-border);background:var(--red-bg);color:var(--red);font-family:inherit;font-size:.875rem;font-weight:700;cursor:pointer;transition:all .15s}
.play-all-btn:hover{background:var(--red);color:#fff}
.prog-bar{flex:1;height:5px;background:var(--border);border-radius:99px;overflow:hidden;min-width:80px}
.prog-fill{height:100%;background:var(--red);border-radius:99px;transition:width .4s ease;width:0%}
.prog-label{font-size:.72rem;color:var(--text-muted);white-space:nowrap}

/* Essay */
.essay-wrap{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.5rem;box-shadow:var(--shadow)}
.essay-title{font-family:'Noto Serif SC',serif;font-size:1.3rem;font-weight:700;color:var(--red);text-align:center;margin-bottom:.2rem}
.essay-sub{font-size:.8rem;color:var(--text-muted);text-align:center;margin-bottom:1.25rem}
.essay-para-wrap{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:1rem 1.1rem .8rem;margin-bottom:10px;cursor:pointer;transition:border-color .15s}
.essay-para-wrap:hover{border-color:var(--border-strong)}
.essay-para-wrap.active-card{border-color:var(--red)}
.para-meta{font-size:.68rem;font-weight:700;color:var(--text-muted);margin-bottom:6px}
.essay-para{font-size:.9375rem;line-height:2;color:var(--text)}

/* Quiz */
.quiz-wrap{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.5rem;box-shadow:var(--shadow)}
.q-meta{font-size:.72rem;font-weight:700;color:var(--text-muted);margin-bottom:.75rem}
.q-text{font-family:'Noto Serif SC',serif;font-size:1.05rem;font-weight:700;color:var(--text);margin-bottom:1.1rem;line-height:1.6}
.q-opts{display:grid;gap:9px}
.q-opt{width:100%;text-align:left;padding:11px 15px;border-radius:var(--radius);border:1.5px solid var(--border);background:var(--surface2);color:var(--text);font-family:inherit;font-size:.9rem;cursor:pointer;display:flex;gap:10px;align-items:center;transition:all .15s}
.q-opt:hover:not(:disabled){background:var(--red-bg);border-color:var(--red-border)}
.q-opt:disabled{cursor:default}
.q-opt.correct{background:var(--green-bg);border-color:var(--green);color:var(--green);font-weight:700}
.q-opt.wrong{background:var(--red-bg);border-color:var(--red);color:var(--red);font-weight:700}
.opt-label{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;flex-shrink:0;color:var(--text-sec)}
.q-fb{display:none;margin-top:1rem;padding:10px 14px;border-radius:var(--radius);font-size:.875rem;line-height:1.6}
.q-fb.show{display:block}
.q-next{margin-top:1rem;padding:10px 22px;border-radius:var(--radius);background:var(--red);color:#fff;border:none;font-family:inherit;font-size:.875rem;font-weight:700;cursor:pointer}

@media(max-width:540px){
  .card-grid{grid-template-columns:1fr}
  .page{padding:1rem .75rem 3rem}
  .hero h1{font-size:1.35rem}
  .voice-sel{min-width:140px}
}
</style>
</head>
<body>
<div class="page">

<!-- Hero -->
<div class="hero">
  <div class="hero-badge">PSLE 华文备考 2026</div>
  <h1>情感词语学习册</h1>
  <p>为 <span class="hero-name">Ryan</span> 特别整理 · 88个必备情感词语 + 范文朗读</p>
</div>

<!-- Voice control panel -->
<div class="voice-panel">
  <div class="voice-panel-title">
    🔊 朗读设置
    <span class="voice-status" id="voiceStatus">检测中…</span>
    <div class="speaking-badge" id="speakBadge" style="margin-left:auto">
      <div class="bars"><span></span><span></span><span></span><span></span><span></span></div>朗读中…
    </div>
  </div>
  <div class="voice-row">
    <span class="voice-lbl">选择声音：</span>
    <select class="voice-sel" id="voiceSel" onchange="onVoiceChange()">
      <option value="">— 加载中 —</option>
    </select>
    <span class="voice-lbl">语速：</span>
    <select class="speed-sel" id="speedSel">
      <option value="0.6">慢 (0.6×)</option>
      <option value="0.75" selected>正常 (0.75×)</option>
      <option value="0.9">稍快 (0.9×)</option>
      <option value="1.1">快 (1.1×)</option>
    </select>
    <button class="test-btn" onclick="testVoice()">🔊 测试朗读</button>
    <button class="stop-all-btn" onclick="stopAll()">■ 停止</button>
  </div>
  <div id="voiceHint" style="font-size:.72rem;color:var(--text-muted);margin-top:8px;line-height:1.6"></div>
</div>

<!-- Tabs -->
<div class="tab-nav">
  <button class="tab-btn active" onclick="switchTab('phrases',this)">📚 情感词语（88个）</button>
  <button class="tab-btn" onclick="switchTab('essay',this)">📖 范文朗读</button>
  <button class="tab-btn" onclick="switchTab('quiz',this)">✏️ 快速测试</button>
</div>

<!-- TAB 1: PHRASES -->
<div class="tab-section active" id="tab-phrases">
  <div class="play-all-wrap">
    <button class="play-all-btn" id="playAllBtn" onclick="togglePlayAll()">▶ 全部朗读</button>
    <div class="prog-bar"><div class="prog-fill" id="progFill"></div></div>
    <span class="prog-label" id="progLabel">0 / 88</span>
  </div>
  <div id="phrase-sections"></div>
</div>

<!-- TAB 2: ESSAY -->
<div class="tab-section" id="tab-essay">
  <div class="essay-wrap">
    <div class="essay-title">《沉迷手机惹的祸》</div>
    <div class="essay-sub">钟老师范文 · 点击段落朗读</div>
    <div class="play-all-wrap">
      <button class="play-all-btn" id="playEssayBtn" onclick="toggleEssayPlay()">▶ 朗读全文</button>
      <div class="prog-bar"><div class="prog-fill" id="essayProg"></div></div>
    </div>
    <div id="essay-content"></div>
  </div>
</div>

<!-- TAB 3: QUIZ -->
<div class="tab-section" id="tab-quiz">
  <div class="quiz-wrap" id="quizWrap"></div>
</div>

</div><!-- end page -->

<script>
/* ══════════════════════════════════
   SPEECH ENGINE — browser Web Speech API
   with full voice detection + fallback
══════════════════════════════════ */
const synth = window.speechSynthesis;
let voices = [];
let selectedVoice = null;
let isSpeaking = false;
let currentUtterance = null;
let playAllActive = false;
let playAllIdx = 0;
let essayPlayActive = false;
let essayPlayIdx = 0;

function getRate() {
  return parseFloat(document.getElementById('speedSel').value) || 0.75;
}

function initVoices() {
  if (!synth) {
    setStatus('err', '您的浏览器不支持朗读功能');
    document.getElementById('voiceHint').textContent = '请使用 Chrome、Edge 或 Safari 浏览器打开此文件。';
    return;
  }

  function loadVoices() {
    const all = synth.getVoices();
    if (!all.length) return;

    // Priority: zh-TW, zh-CN, zh-HK, zh, then any
    const zh = all.filter(v => v.lang.startsWith('zh'));
    const tw = all.filter(v => v.lang === 'zh-TW' || v.lang === 'zh_TW');
    const cn = all.filter(v => v.lang === 'zh-CN' || v.lang === 'zh_CN');
    const hk = all.filter(v => v.lang === 'zh-HK' || v.lang === 'zh_HK');

    // Sort: put female / natural sounding first
    const prefer = ['Meijia','Sinji','Tingting','Lekha','Sin-ji','Mei-Jia','Google 普通话','Microsoft Huihui','Microsoft Yaoyao','Microsoft Kangkang'];
    zh.sort((a,b) => {
      const ai = prefer.findIndex(p => a.name.includes(p));
      const bi = prefer.findIndex(p => b.name.includes(p));
      if(ai>=0&&bi<0) return -1;
      if(bi>=0&&ai<0) return 1;
      return ai-bi;
    });

    voices = zh.length ? zh : all;
    selectedVoice = voices[0] || null;

    const sel = document.getElementById('voiceSel');
    sel.innerHTML = '';
    voices.forEach((v, i) => {
      const o = document.createElement('option');
      o.value = i;
      o.textContent = v.name + ' (' + v.lang + ')' + (v.localService ? ' ✓' : ' ☁');
      sel.appendChild(o);
    });

    if (zh.length) {
      setStatus('ok', '✅ 找到 ' + zh.length + ' 个中文声音');
      document.getElementById('voiceHint').textContent =
        '✓ = 本地声音（离线可用）· ☁ = 在线声音。建议选择 ✓ 本地声音以确保稳定朗读。';
    } else {
      setStatus('warn', '⚠️ 未找到中文声音');
      document.getElementById('voiceHint').innerHTML =
        '未找到中文声音。请在系统设置中安装中文语音包，或使用 Chrome/Edge 浏览器。<br>' +
        '<strong>Mac:</strong> 系统设置 → 辅助功能 → 朗读内容 → 系统声音 → 添加中文声音<br>' +
        '<strong>Windows:</strong> 设置 → 时间和语言 → 语音 → 添加声音（中文普通话）';
    }
  }

  loadVoices();
  if (synth.onvoiceschanged !== undefined) {
    synth.onvoiceschanged = loadVoices;
  }
  // Chrome needs a small delay
  setTimeout(loadVoices, 200);
  setTimeout(loadVoices, 800);
}

function onVoiceChange() {
  const i = +document.getElementById('voiceSel').value;
  selectedVoice = voices[i] || null;
}

function setStatus(type, msg) {
  const el = document.getElementById('voiceStatus');
  el.className = 'voice-status ' + type;
  el.textContent = msg;
}

function speak(text, onEnd) {
  if (!synth) return;
  synth.cancel();
  isSpeaking = false;

  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = selectedVoice ? selectedVoice.lang : 'zh-CN';
  utt.rate = getRate();
  utt.pitch = 1;
  utt.volume = 1;
  if (selectedVoice) utt.voice = selectedVoice;

  utt.onstart = () => {
    isSpeaking = true;
    document.getElementById('speakBadge').classList.add('show');
  };
  utt.onend = () => {
    isSpeaking = false;
    document.getElementById('speakBadge').classList.remove('show');
    clearActiveCards();
    if (onEnd) onEnd();
  };
  utt.onerror = (e) => {
    isSpeaking = false;
    document.getElementById('speakBadge').classList.remove('show');
    clearActiveCards();
    if (onEnd) onEnd();
  };

  currentUtterance = utt;
  synth.speak(utt);

  // Chrome bug: speech sometimes pauses silently — keep it alive
  const keepAlive = setInterval(() => {
    if (!synth.speaking) { clearInterval(keepAlive); return; }
    synth.pause();
    synth.resume();
  }, 8000);
}

function stopAll() {
  playAllActive = false;
  essayPlayActive = false;
  if (synth) synth.cancel();
  isSpeaking = false;
  document.getElementById('speakBadge').classList.remove('show');
  clearActiveCards();
  resetPlayAllBtn();
  resetEssayBtn();
}

function clearActiveCards() {
  document.querySelectorAll('.active-card').forEach(c => c.classList.remove('active-card'));
  document.querySelectorAll('.card-speak-btn.on').forEach(b => { b.textContent = '🔊 朗读'; b.classList.remove('on'); });
  document.querySelectorAll('[id^="eplaybtn-"].on').forEach(b => { b.textContent = '🔊 朗读此段'; b.classList.remove('on'); });
}

function testVoice() {
  stopAll();
  speak('你好，Ryan！我们开始学习华文情感词语吧！加油！', null);
}

/* ══════════════════════════════════
   PHRASES DATA
══════════════════════════════════ */
const SECTIONS = [
  { id:'anger',   icon:'😡', title:'生气 · Anger',              count:9  },
  { id:'fear',    icon:'😨', title:'害怕 · Fear',               count:8  },
  { id:'nervous', icon:'😰', title:'紧张 · Nervous',            count:7  },
  { id:'anxious', icon:'😟', title:'着急·担心 · Anxious & Worried', count:7 },
  { id:'sad',     icon:'😢', title:'伤心·感动 · Sad & Touched', count:7  },
  { id:'disappointed',icon:'😞',title:'失望 · Disappointed',   count:4  },
  { id:'happy',   icon:'😄', title:'开心·兴奋 · Happy & Excited',count:9 },
  { id:'proud',   icon:'😤', title:'骄傲·自信 · Proud & Confident',count:4},
  { id:'ashamed', icon:'😳', title:'惭愧·难为情 · Ashamed & Embarrassed',count:6},
  { id:'regret',  icon:'😔', title:'后悔 · Regretful',          count:4  },
  { id:'shocked', icon:'😲', title:'吃惊 · Shocked',            count:5  },

const CAT_CLASS = {anger:'emo-anger',fear:'emo-fear',nervous:'emo-nervous',anxious:'emo-anxious',sad:'emo-sad',disappointed:'emo-disappointed',happy:'emo-happy',proud:'emo-proud',ashamed:'emo-ashamed',regret:'emo-regret',shocked:'emo-shocked',relieved:'emo-relieved',wronged:'emo-wronged',jealous:'emo-jealous',complex:'emo-complex'};

/* ── Build phrase cards ── */
function buildPhrases() {
  const container = document.getElementById('phrase-sections');
  SECTIONS.forEach(sec => {
    const phrases = ALL_PHRASES.filter(p => p.cat === sec.id);
    const secDiv = document.createElement('div');
    secDiv.innerHTML = `<div class="section-head"><span class="section-icon">${sec.icon}</span><span class="section-title">${sec.title}</span><span class="section-sub">${phrases.length} 个词语</span></div>`;
    const grid = document.createElement('div');
    grid.className = 'card-grid';
    phrases.forEach((p, localIdx) => {
      const globalIdx = ALL_PHRASES.indexOf(p);
      const card = document.createElement('div');
      card.className = 'phrase-card';
      card.id = 'card-' + globalIdx;
      card.innerHTML = `
        <span class="phrase-num">${p.id}</span>
        <span class="emo-tag ${CAT_CLASS[p.cat]}">${p.tag}</span>
        <div class="phrase-chinese">${p.zh}</div>
        <div class="phrase-pinyin">${p.py}</div>
        <div class="phrase-meaning">意思：${p.meaning}</div>
        <div class="phrase-example">${p.ex}</div>
        <button class="card-speak-btn" id="csb-${globalIdx}" onclick="speakCard(${globalIdx})">🔊 朗读</button>`;
      grid.appendChild(card);
    });
    secDiv.appendChild(grid);
    container.appendChild(secDiv);
  });
}

function speakCard(i) {
  const p = ALL_PHRASES[i];
  const btn = document.getElementById('csb-' + i);
  const card = document.getElementById('card-' + i);

  // If already speaking this card, stop it
  if (isSpeaking && card && card.classList.contains('active-card')) {
    stopAll();
    return;
  }

  stopAll();

  // Highlight this card
  clearActiveCards();
  if (card) card.classList.add('active-card');
  if (btn) { btn.textContent = '■ 停止'; btn.classList.add('on'); }

  // Update progress bar
  const pct = Math.round(((i + 1) / ALL_PHRASES.length) * 100);
  document.getElementById('progFill').style.width = pct + '%';
  document.getElementById('progLabel').textContent = (i + 1) + ' / ' + ALL_PHRASES.length;

  // Scroll card into view
  if (card) card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

  const text = p.zh + '。' + p.py + '。意思是：' + p.meaning + '。例句：' + p.ex;
  speak(text, () => {
    if (card) card.classList.remove('active-card');
    if (btn) { btn.textContent = '🔊 朗读'; btn.classList.remove('on'); }
    if (playAllActive) {
      playAllIdx = i + 1;
      if (playAllIdx < ALL_PHRASES.length) {
        setTimeout(() => speakCard(playAllIdx), 700);
      } else {
        playAllActive = false;
        resetPlayAllBtn();
      }
    }
  });
}

function togglePlayAll() {
  if (playAllActive) {
    playAllActive = false;
    stopAll();
    resetPlayAllBtn();
    return;
  }
  playAllActive = true;
  playAllIdx = 0;
  const btn = document.getElementById('playAllBtn');
  btn.textContent = '■ 停止全部';
  btn.style.background = 'var(--red)';
  btn.style.color = '#fff';
  speakCard(0);
}

function resetPlayAllBtn() {
  const btn = document.getElementById('playAllBtn');
  if (btn) { btn.textContent = '▶ 全部朗读'; btn.style.background = ''; btn.style.color = ''; }
}

function buildEssay() {
  const c = document.getElementById('essay-content');
  ESSAY.forEach((para, i) => {
    const div = document.createElement('div');
    div.className = 'essay-para-wrap';
    div.id = 'ep-' + i;

      <p class="essay-para">${para}</p>
      <button class="card-speak-btn" id="eplaybtn-${i}" onclick="speakEssayPara(${i})">🔊 朗读此段</button>`;
    c.appendChild(div);
  });

function speakEssayPara(i) {
  const card = document.getElementById('ep-' + i);

let qDeck=[], qIdx=0, qCorrect=0, qWrong=0;

function buildQuiz() {
  qDeck = [...QUIZ].sort(() => Math.random() - .5);
  qIdx = 0; qCorrect = 0; qWrong = 0;
  renderQuiz();
}

function renderQuiz() {
  const wrap = document.getElementById('quizWrap');
  if (qIdx >= qDeck.length) {
    const pct = Math.round((qCorrect / qDeck.length) * 100);
    wrap.innerHTML = `<div style="text-align:center;padding:2rem 1rem">
      <div style="font-size:3.5rem;margin-bottom:.5rem">${pct>=80?'🌟🌟🌟':pct>=60?'⭐⭐':'⭐'}</div>
      <div style="font-family:'Noto Serif SC',serif;font-size:1.6rem;font-weight:700;color:var(--red);margin-bottom:.5rem">${pct}%</div>
      <div style="font-size:1rem;color:var(--text-sec);margin-bottom:.5rem">${qCorrect} 对 / ${qDeck.length} 题</div>
      <div style="font-size:.9rem;color:var(--text-muted);margin-bottom:2rem">${pct>=80?'太棒了！Ryan加油！💪':pct>=60?'不错！继续练习！':'再来一次，你可以的！'}</div>
      <button onclick="buildQuiz()" style="padding:11px 28px;border-radius:var(--radius);background:var(--red);color:#fff;border:none;font-family:inherit;font-size:.9rem;font-weight:700;cursor:pointer">🔄 再来一次</button>
    </div>`;
    return;
  }
  const q = qDeck[qIdx];
  wrap.innerHTML = `
    <div class="q-meta">第 ${qIdx+1} 题 / 共 ${qDeck.length} 题 &nbsp;·&nbsp; ✅ ${qCorrect} 对 &nbsp; ❌ ${qWrong} 错</div>
    <div class="q-text">${q.q}</div>
    <div class="q-opts">
      ${q.opts.map((o,i)=>`<button class="q-opt" id="qo${i}" onclick="pickQuiz(${i})">
        <span class="opt-label">${['A','B','C','D'][i]}</span>${o}</button>`).join('')}
    </div>
    <div class="q-fb" id="qfb"></div>
    <div id="qnext"></div>`;
  speak(q.q, null);
}

function pickQuiz(i) {
  const q = qDeck[qIdx];
  ['A','B','C','D'].forEach((_,j) => {
    const b = document.getElementById('qo'+j);
    if (b) b.disabled = true;
  });
  const correct = document.getElementById('qo' + q.ans);
  const picked = document.getElementById('qo' + i);
  if (correct) correct.classList.add('correct');
  if (i !== q.ans && picked) picked.classList.add('wrong');

  const isOk = i === q.ans;
  if (isOk) qCorrect++; else qWrong++;

  const fb = document.getElementById('qfb');
  fb.classList.add('show');
  fb.style.background = isOk ? 'var(--green-bg)' : 'var(--red-bg)';
  fb.style.borderLeft = '3px solid ' + (isOk ? 'var(--green)' : 'var(--red)');
  fb.style.color = 'var(--text-sec)';
  fb.innerHTML = isOk
    ? '✅ 答对了！很棒，Ryan！'
    : '❌ 答错了。正确答案是：<strong style="color:var(--green)">' + q.opts[q.ans] + '</strong>';

  speak(isOk ? '答对了！' : '答错了，正确答案是' + q.opts[q.ans], null);

  document.getElementById('qnext').innerHTML =
    `<button class="q-next" onclick="qIdx++;renderQuiz()">${qIdx+1>=qDeck.length?'查看成绩 🎉':'下一题 →'}</button>`;
}

/* ── Tabs ── */
function switchTab(name, btn) {
  stopAll();
  document.querySelectorAll('.tab-section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  if (btn) btn.classList.add('active');
  if (name === 'quiz' && qDeck.length === 0) buildQuiz();
}
