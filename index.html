<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,'PingFang SC',Arial,sans-serif;background:#f0f7ff;color:#1e293b;min-height:100vh;padding:12px;-webkit-text-size-adjust:100%;}
h1{text-align:center;font-size:1.4rem;font-weight:900;color:#2563eb;margin-bottom:2px;}
.sub{text-align:center;font-size:.76rem;color:#64748b;margin-bottom:14px;}
.filters{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-bottom:12px;}
.fb{padding:5px 11px;border-radius:20px;border:2px solid #e2e8f0;background:#fff;font-family:inherit;font-size:.74rem;font-weight:700;color:#64748b;cursor:pointer;}
.fb.on{background:#2563eb;border-color:#2563eb;color:#fff;}
.tabs{display:flex;gap:8px;margin-bottom:14px;}
.tab{flex:1;padding:10px 0;border-radius:12px;border:2px solid #e2e8f0;background:#fff;font-family:inherit;font-size:.85rem;font-weight:800;color:#64748b;cursor:pointer;}
.tab.on{background:#2563eb;border-color:#2563eb;color:#fff;}
.stats{display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap;}
.chip{background:#fff;border-radius:10px;padding:4px 12px;font-size:.75rem;font-weight:700;border:2px solid #e2e8f0;}
.chip b{color:#2563eb;}

/* FLASHCARD */
#fl{display:block;}
#qz,#pr{display:none;}
.ctr{text-align:center;font-size:.78rem;color:#64748b;font-weight:700;margin-bottom:6px;}
.card{border-radius:20px;padding:28px 20px;text-align:center;min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;cursor:pointer;margin-bottom:14px;}
.card-front{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;box-shadow:0 4px 20px rgba(37,99,235,.22);}
.card-back{background:#fff;border:2px solid #e2e8f0;box-shadow:0 2px 12px rgba(0,0,0,.07);}
.tag{position:absolute;top:10px;right:12px;background:rgba(255,255,255,.22);border-radius:8px;padding:2px 8px;font-size:.65rem;font-weight:700;}
.hint{position:absolute;bottom:10px;font-size:.68rem;opacity:.5;}
.spkbtn{position:absolute;top:10px;left:12px;background:rgba(255,255,255,.22);border:none;border-radius:8px;padding:4px 9px;font-size:.9rem;cursor:pointer;color:#fff;line-height:1;}
.spkbtn:active{background:rgba(255,255,255,.4);}
.big{font-size:2.5rem;font-weight:900;letter-spacing:4px;margin-bottom:4px;}
.py{font-size:.88rem;color:#64748b;margin-bottom:8px;}
.en{font-size:1.2rem;font-weight:800;color:#2563eb;margin-bottom:8px;}
.pc{font-size:.85rem;font-weight:700;color:#f59e0b;margin-bottom:8px;}
.ex{font-size:.74rem;color:#64748b;line-height:1.55;border-top:1px solid #e2e8f0;padding-top:8px;max-height:80px;overflow:hidden;}
.navrow{display:flex;gap:10px;justify-content:center;margin-bottom:10px;}
.nbtn{padding:9px 22px;border-radius:12px;border:none;font-family:inherit;font-size:.85rem;font-weight:800;cursor:pointer;}
.nbtn.prev{background:#e2e8f0;color:#1e293b;}
.nbtn.nxt{background:#2563eb;color:#fff;}
.nbtn:disabled{opacity:.35;cursor:not-allowed;}
.marks{display:flex;gap:10px;justify-content:center;margin-bottom:10px;}
.mbtn{padding:8px 20px;border-radius:10px;font-family:inherit;font-size:.82rem;font-weight:800;cursor:pointer;}
.mbtn.yes{border:2px solid #10b981;color:#10b981;background:#d1fae5;}
.mbtn.no{border:2px solid #ef4444;color:#ef4444;background:#fee2e2;}
.pbar{height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden;}
.pbarfill{height:100%;background:linear-gradient(90deg,#10b981,#059669);border-radius:4px;transition:width .4s;}

/* QUIZ */
.qhdr{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.qpb{flex:1;height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden;}
.qpbf{height:100%;background:#f59e0b;border-radius:4px;}
.qcard{background:#fff;border-radius:20px;padding:22px 16px;box-shadow:0 2px 12px rgba(0,0,0,.07);margin-bottom:14px;}
.qcn{font-size:2rem;font-weight:900;color:#2563eb;text-align:center;letter-spacing:3px;margin:8px 0 16px;}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.qopt{padding:12px 8px;border-radius:12px;font-family:inherit;font-size:.82rem;font-weight:700;text-align:center;cursor:pointer;line-height:1.3;border:2px solid #e2e8f0;background:#fff;color:#1e293b;}
.qopt.correct{border-color:#10b981;background:#d1fae5;color:#10b981;}
.qopt.wrong{border-color:#ef4444;background:#fee2e2;color:#ef4444;}
.qfb{text-align:center;margin-top:10px;font-weight:800;font-size:.9rem;min-height:22px;}
.qfb.ok{color:#10b981;}
.qfb.err{color:#ef4444;}
.qnxt{display:none;margin:12px auto 0;padding:10px 30px;background:#2563eb;color:#fff;border:none;border-radius:12px;font-family:inherit;font-size:.88rem;font-weight:800;cursor:pointer;}
.done{background:#fff;border-radius:20px;padding:36px 20px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.08);}
.dscore{font-size:3rem;font-weight:900;color:#f59e0b;margin:10px 0;}
.dmsg{color:#64748b;margin-bottom:16px;}
.rbtn{padding:11px 30px;background:#2563eb;color:#fff;border:none;border-radius:12px;font-family:inherit;font-size:.9rem;font-weight:800;cursor:pointer;}

/* PRINT / WORDLIST */
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.wcard{background:#fff;border-radius:12px;padding:10px 12px;border:2px solid #e2e8f0;}
.wtag{font-size:.62rem;font-weight:700;color:#2563eb;background:#dbeafe;display:inline-block;padding:1px 6px;border-radius:5px;margin-bottom:3px;}
.wcn{font-size:1.15rem;font-weight:900;letter-spacing:2px;margin:2px 0;}
.wen{font-size:.76rem;font-weight:800;color:#2563eb;}
.wpc{font-size:.7rem;color:#f59e0b;font-weight:700;margin-top:2px;}
</style>
</head>
<body>
<h1>📚 Ryan的词语复习</h1>
<div class="sub">小五 5A &amp; 5B · 15课</div>

<div class="filters" id="filters"></div>

<div class="tabs">
  <button class="tab on" onclick="goMode('fl')">🃏 闪卡</button>
  <button class="tab" onclick="goMode('qz')">🎯 测验</button>
  <button class="tab" onclick="goMode('pr')">📋 词表</button>
</div>

<div class="stats">
  <div class="chip">共 <b id="tot">0</b> 词</div>
  <div class="chip">✅ <b id="kn">0</b></div>
  <div class="chip">📖 <b id="rv">0</b> 待复习</div>
</div>

<!-- FLASHCARD -->
<div id="fl">
  <div class="ctr" id="ctr"></div>
  <div class="card card-front" id="cfront" onclick="flip()">
    <button class="spkbtn" id="spkbtn" onclick="event.stopPropagation();speak()">🔊</button>
    <div class="tag" id="ftag"></div>
    <div class="big" id="fcn"></div>
    <div class="hint">🔊 听发音 · 👆 点击翻转</div>
  </div>
  <div class="card card-back" id="cback" onclick="flip()" style="display:none;">
    <div class="py" id="fpy"></div>
    <div class="en" id="fen"></div>
    <div class="pc" id="fpc"></div>
    <div class="ex" id="fex"></div>
  </div>
  <div class="navrow">
    <button class="nbtn prev" id="bprev" onclick="prevCard()">← 上一张</button>
    <button class="nbtn nxt" id="bnext" onclick="nextCard()">下一张 →</button>
  </div>
  <div class="marks">
    <button class="mbtn yes" onclick="mark(true)">✅ 认识</button>
    <button class="mbtn no" onclick="mark(false)">❌ 不认识</button>
  </div>
  <div class="pbar"><div class="pbarfill" id="pf" style="width:0%"></div></div>
</div>

<!-- QUIZ -->
<div id="qz">
  <div class="qhdr">
    <span style="font-size:.76rem;font-weight:700;color:#64748b;white-space:nowrap">第 <span id="qnum">1</span>/<span id="qtot">15</span></span>
    <div class="qpb"><div class="qpbf" id="qpbf" style="width:0%"></div></div>
    <span style="font-size:.76rem;font-weight:700;color:#10b981">🏆 <span id="qsc">0</span></span>
  </div>
  <div class="qcard" id="qcard">
    <div style="font-size:.72rem;font-weight:700;color:#64748b;">选出正确的英文意思：</div>
    <div class="qcn" id="qcn"></div>
    <div class="qgrid" id="qopts"></div>
    <div class="qfb" id="qfb"></div>
    <button class="qnxt" id="qnxt" onclick="qNext()">下一题 →</button>
  </div>
  <div class="done" id="qdone" style="display:none;">
    <div style="font-size:1.6rem;font-weight:900;color:#2563eb;">🎉 完成！</div>
    <div class="dscore" id="dsc"></div>
    <div class="dmsg" id="dmsg"></div>
    <button class="rbtn" onclick="startQuiz()">再来一次！</button>
  </div>
</div>

<!-- WORDLIST -->
<div id="pr">
  <div style="text-align:center;font-size:.76rem;color:#64748b;margin-bottom:10px;">当前课的词语列表（无拼音，考考自己！）</div>
  <div class="wgrid" id="wgrid"></div>
</div>

var LESSONS=["全部"].concat([...new Set(V.map(function(v){return v.l;}))]);
var deck=[],idx=0,known=new Set(),flipped=false;
var qDeck=[],qIdx=0,qScore=0,qOpts=[],qChosen=null,qAnswered=false;
var curLesson="全部",curMode="fl";

function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;}return b;}

function init(){
  var f=document.getElementById("filters");
  LESSONS.forEach(function(l){
    var b=document.createElement("button");
    b.className="fb"+(l==="全部"?" on":"");
    b.textContent=l==="全部"?"全部":l.split(" ")[0];
    b.setAttribute("data-l",l);
    b.addEventListener("click",function(){setLesson(l);});
    f.appendChild(b);
  });
  setLesson("全部");
}

function setLesson(l){
  curLesson=l;
  var pool=l==="全部"?V:V.filter(function(v){return v.l===l;});
  deck=shuffle(pool);
  idx=0;known=new Set();flipped=false;
  document.querySelectorAll(".fb").forEach(function(b){
    b.classList.toggle("on",b.getAttribute("data-l")===l);
  });
  updateStats();renderCard();
  if(curMode==="qz")startQuiz();
  if(curMode==="pr")renderList();
}

function updateStats(){
  document.getElementById("tot").textContent=deck.length;
  document.getElementById("kn").textContent=known.size;
  document.getElementById("rv").textContent=deck.length-known.size;
}

function speak(){
  if(!deck.length||!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(deck[idx].c);
  u.lang="zh-CN";
  u.rate=0.8;
  var voices=window.speechSynthesis.getVoices();
  // Priority: zh-CN (Simplified/Mainland) → zh-SG (Singapore) → any zh except zh-TW
  var zhVoice=
    voices.find(function(v){return v.lang==="zh-CN";}) ||
    voices.find(function(v){return v.lang==="zh-SG";}) ||
    voices.find(function(v){return v.lang.startsWith("zh") && v.lang!=="zh-TW" && v.lang!=="zh-HK";});
  if(zhVoice)u.voice=zhVoice;
  window.speechSynthesis.speak(u);
}

function renderCard(){
  if(!deck.length)return;
  var v=deck[idx];
  document.getElementById("ftag").textContent=v.l;
  document.getElementById("fcn").textContent=v.c;
  document.getElementById("fpy").textContent=v.p;
  document.getElementById("fen").textContent=v.e;
  document.getElementById("fpc").textContent=v.pc?"配词："+v.pc:"";
  document.getElementById("fex").textContent=v.x;
  document.getElementById("ctr").textContent=(idx+1)+" / "+deck.length;
  // reset flip - always show front
  flipped=false;
  document.getElementById("cfront").style.display="flex";
  document.getElementById("cback").style.display="none";
  document.getElementById("pf").style.width=(known.size/deck.length*100)+"%";
  document.getElementById("bprev").disabled=idx===0;
  document.getElementById("bnext").disabled=idx===deck.length-1;
  // Auto-speak after short delay (needed for iOS voice loading)
  setTimeout(speak, 300);
}

function flip(){
  flipped=!flipped;
  document.getElementById("cfront").style.display=flipped?"none":"flex";
  document.getElementById("cback").style.display=flipped?"flex":"none";
}
function nextCard(){if(idx<deck.length-1){idx++;renderCard();}}
function prevCard(){if(idx>0){idx--;renderCard();}}
function mark(yes){if(yes)known.add(idx);updateStats();nextCard();}

function goMode(m){
  curMode=m;
  ["fl","qz","pr"].forEach(function(id){
    document.getElementById(id).style.display=id===m?"block":"none";
  });
  document.querySelectorAll(".tab").forEach(function(t,i){
    t.classList.toggle("on",["fl","qz","pr"][i]===m);
  });
  if(m==="qz")startQuiz();
  if(m==="pr")renderList();
}

function startQuiz(){
  document.getElementById("qdone").style.display="none";
  document.getElementById("qcard").style.display="block";
  var pool=curLesson==="全部"?V:V.filter(function(v){return v.l===curLesson;});
  qDeck=shuffle(pool.slice()).slice(0,Math.min(15,pool.length));
  qIdx=0;qScore=0;qChosen=null;qAnswered=false;
  document.getElementById("qtot").textContent=qDeck.length;
  document.getElementById("qsc").textContent=0;
  renderQ();
}

function renderQ(){
  if(qIdx>=qDeck.length){showDone();return;}
  qAnswered=false;qChosen=null;
  var v=qDeck[qIdx];
  document.getElementById("qnum").textContent=qIdx+1;
  document.getElementById("qcn").textContent=v.c;
  document.getElementById("qfb").textContent="";
  document.getElementById("qfb").className="qfb";
  document.getElementById("qnxt").style.display="none";
  document.getElementById("qpbf").style.width=(qIdx/qDeck.length*100)+"%";
  var wrongs=shuffle(V.filter(function(x){return x.e!==v.e;})).slice(0,3);
  qOpts=shuffle([v].concat(wrongs));
  var el=document.getElementById("qopts");
  el.innerHTML="";
  qOpts.forEach(function(o){
    var b=document.createElement("button");
    b.className="qopt";b.textContent=o.e;
    b.addEventListener("click",function(){checkAns(b,o,v);});
    el.appendChild(b);
  });
}

function checkAns(btn,chosen,correct){
  if(qAnswered)return;
  qAnswered=true;qChosen=chosen;
  document.querySelectorAll(".qopt").forEach(function(b){
    b.disabled=true;
    if(b.textContent===correct.e)b.classList.add("correct");
  });
  if(chosen.e===correct.e){
    qScore++;btn.classList.add("correct");
    document.getElementById("qfb").textContent="🎉 答对了！";
    document.getElementById("qfb").className="qfb ok";
  }else{
    btn.classList.add("wrong");
    document.getElementById("qfb").textContent="❌ 正确："+correct.e;
    document.getElementById("qfb").className="qfb err";
  }
  document.getElementById("qsc").textContent=qScore;
  document.getElementById("qnxt").style.display="block";
}

function qNext(){qIdx++;renderQ();}

function showDone(){
  document.getElementById("qcard").style.display="none";
  document.getElementById("qdone").style.display="block";
  var t=qDeck.length,p=qScore/t;
  document.getElementById("dsc").textContent=qScore+" / "+t;
  document.getElementById("dmsg").textContent=p>=0.9?"🌟 太棒了！华语小达人！":p>=0.7?"👍 做得很好！继续加油！":"💪 再多练习，你能行！";
}

function renderList(){
  var el=document.getElementById("wgrid");
  el.innerHTML="";
  deck.forEach(function(v){
    var d=document.createElement("div");
    d.className="wcard";
    d.innerHTML='<div class="wtag">'+v.l+'</div><div class="wcn">'+v.c+'</div><div class="wen">'+v.e+'</div>'+(v.pc?'<div class="wpc">配：'+v.pc+'</div>':'');
    el.appendChild(d);
  });
}

// iOS Safari loads voices asynchronously — trigger early load
if(window.speechSynthesis){
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged=function(){window.speechSynthesis.getVoices();};
}
init();
</script>
